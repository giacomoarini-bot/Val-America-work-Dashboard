  <script>
    // Forza il runtime JSX "classico" (React.createElement).
    // Le versioni recenti di @babel/standalone usano di default il runtime
    // "automatico", che genera `import ... from "react/jsx-runtime"`: essendo
    // eseguito come script classico (non modulo) e con React caricato via UMD,

    const app = initializeApp(firebaseConfig);

    // Detect if config still contains placeholders (compare values, not source code)
    window.fbConfigValid = !Object.values(firebaseConfig).some(v =>

    // Expose Firestore helpers to React app

      onSnapshotCollection: (path, cb) => onSnapshot(collection(db, ...path.split('/')), cb),
      getCollection: (path) => getDocs(collection(db, ...path.split('/'))),
      deleteField: () => deleteField()

    window.fbReady = true;

    // ============== HELPERS ==============
    const todayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const detectPeriod = () => {
      const h = new Date().getHours();
      if (h >= 5 && h < 13) return 'mattina';
      if (h >= 13 && h < 18) return 'pomeriggio';
      return 'sera';
    };
    const formatTime = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    };
    const formatDateLong = (key) => {
      const [y, m, d] = key.split('-');
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    };
    const greeting = () => {
      const h = new Date().getHours();
      if (h < 12) return 'Buongiorno';
      if (h < 18) return 'Buon pomeriggio';
      return 'Buonasera';
    };

    // Local-only persistence (per device — keeps logged-in employee)
    const localGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
    const localSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
    const localDel = (k) => { try { localStorage.removeItem(k); } catch {} };

    // ============== MULTI-AREA / MULTI-PERIOD HELPERS ==============
    // Tasks support multiple periods and multiple areas. Schema:
    //   periods: ['mattina', 'sera']  (array)
    //   areas:   ['bar', 'sala']       (array)
    //   synced:  true | false          (when false, each period+area combo is an
    //                                   independent check; when true, all share one)
    // Backward compat: legacy tasks with singular `period`/`area` are read transparently.
    const getTaskPeriods = (task) => {
      if (Array.isArray(task.periods) && task.periods.length > 0) return task.periods;
      if (task.period) return [task.period];
      return [];
    };
    const getTaskAreas = (task) => {
      if (Array.isArray(task.areas) && task.areas.length > 0) return task.areas;
      if (task.area) return [task.area];
      return [];
    };
    const isTaskSynced = (task) => {
      if (typeof task.synced === 'boolean') return task.synced;
      return true; // default: synced
    };
    // Compose the key used in the daily state document for a given (task, period, area) combo.
    // - For synced tasks: just the task id (one key for all combos).
    // - For independent tasks: taskId__period__area (one key per combo).
    const slotKey = (task, period, area) => {
      if (isTaskSynced(task)) return task.id;
      return `${task.id}__${period}__${area}`;
    };
    // Returns true if a task should appear in the given period.
    const taskInPeriod = (task, period) => getTaskPeriods(task).includes(period);
    // Returns true if a task should appear in the given area.
    const taskInArea = (task, area) => getTaskAreas(task).includes(area);

    // ============== FREQUENCY SYSTEM ==============
    // Each task has an optional `frequency` object. If missing → daily (default).
    // Types:
    //   {type: 'daily'} → due every day (legacy/default)
    //   {type: 'weekdays', days: [1,3,5]} → due on specific weekdays (0=Sun, 1=Mon, ..., 6=Sat)
    //   {type: 'interval', days: 7, lastDone: '2026-05-02' | null} → due every N days from lastDone
    //                                                                  (lastDone is updated globally
    //                                                                  every time anyone completes the task)
    const WEEKDAY_LABELS = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
    const WEEKDAY_LABELS_FULL = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];

    // Parse 'YYYY-MM-DD' into a Date (local time, no timezone shift)
    const parseDate = (key) => {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    };

    // Days between two YYYY-MM-DD strings (b - a, can be negative)
    const daysBetween = (a, b) => {
      const ms = parseDate(b).getTime() - parseDate(a).getTime();
      return Math.round(ms / 86400000);
    };

    // Returns true if a task is "due" on the given date (default: today)
    const isTaskDue = (task, dateKey = todayKey()) => {
      const freq = task.frequency;
      if (!freq || freq.type === 'daily') return true;

      if (freq.type === 'weekdays') {
        const dow = parseDate(dateKey).getDay(); // 0..6
        return Array.isArray(freq.days) && freq.days.includes(dow);
      }

      if (freq.type === 'interval') {
        const interval = Math.max(1, freq.days || 1);
        if (!freq.lastDone) return true; // never done → due
        const elapsed = daysBetween(freq.lastDone, dateKey);
        return elapsed >= interval;
      }

      return true; // unknown type → fail-safe to visible
    };

    // Short human-readable frequency label (for the UI badge)
    const frequencyLabel = (task) => {
      const freq = task.frequency;
      if (!freq || freq.type === 'daily') return null;
      if (freq.type === 'weekdays') {
        if (!Array.isArray(freq.days) || freq.days.length === 0) return 'Mai';
        if (freq.days.length === 7) return 'Quotidiana';
        // Recognize common patterns
        const sorted = [...freq.days].sort();
        const k = sorted.join(',');
        if (k === '1,2,3,4,5') return 'Lun-Ven';
        if (k === '0,6') return 'Weekend';
        return sorted.map(d => WEEKDAY_LABELS[d]).join('·');
      }
      if (freq.type === 'interval') {
        const n = freq.days || 1;
        if (n === 1) return 'Quotidiana';
        if (n === 7) return 'Settimanale';
        if (n === 14) return 'Quindicinale';
        if (n === 30) return 'Mensile';
        return `Ogni ${n} gg`;
      }
      return null;
    };

    // ============== ICONS (inline SVG, no external dep) ==============
    const Icon = ({ name, className = "w-4 h-4", strokeWidth = 2, style }) => {

    // ============== APP ==============
    function App() {
      const [fbReady, setFbReady] = useState(!!window.fbReady);
      const [screen, setScreen] = useState('loading');
      const [currentUser, setCurrentUser] = useState(null);
      const [employees, setEmployees] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [dayState, setDayState] = useState({});
      const [adminPin, setAdminPinValue] = useState(DEFAULT_PIN);
      const [activePeriod, setActivePeriod] = useState(detectPeriod());
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);
      const [adminTab, setAdminTab] = useState('tasks');
      const [notes, setNotes] = useState([]);
      const [notesTab, setNotesTab] = useState('active');
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [ordersTab, setOrdersTab] = useState('current');
      const [toast, setToast] = useState(null);
      const [connectionError, setConnectionError] = useState(null);

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2400);
      }, []);

      // Wait for Firebase to load
      useEffect(() => {
        if (window.fbReady) { setFbReady(true); return; }
        const handler = () => setFbReady(true);
        window.addEventListener('fbready', handler);
        return () => window.removeEventListener('fbready', handler);
      }, []);

      // Initial seed + load
      useEffect(() => {
        if (!fbReady) return;
        (async () => {
          try {
            // Check if config is filled
            if (firebaseConfigPlaceholder()) {
              setConnectionError('config');
              return;
            }

            // Seed config doc if missing
            const configRef = 'app/config';
            const configSnap = await window.fb.getDoc(configRef);
            if (!configSnap.exists()) {
              await window.fb.setDoc(configRef, {
                pin: DEFAULT_PIN,
                employees: DEFAULT_EMPLOYEES,
                tasks: DEFAULT_TASKS,
                createdAt: new Date().toISOString()
              }, { merge: false });
            }

            // Live subscribe to config
            window.fb.onSnapshot(configRef, (snap) => {
              const data = snap.data();
              if (data) {
                setEmployees(data.employees || []);
                setTasks(data.tasks || []);
                setAdminPinValue(data.pin || DEFAULT_PIN);
              }
            });

            // Live subscribe to today's state
            window.fb.onSnapshot(`days/${todayKey()}`, (snap) => {
              const data = snap.exists() ? snap.data() : {};
              setDayState(data || {});
            });

            // Live subscribe to notes collection
            window.fb.onSnapshotCollection('notes', (snap) => {
              const arr = [];
              snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
              // Sort: important first, then newest first
              arr.sort((a, b) => {
                if (a.important !== b.important) return a.important ? -1 : 1;
                return (b.createdAt || '').localeCompare(a.createdAt || '');
              });
              setNotes(arr);
            });

            // Live subscribe to products collection = righe dell'ordine in corso
            window.fb.onSnapshotCollection('products', (snap) => {
              const arr = [];
              snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
              // Ordine di inserimento (come una tabella): dal più vecchio al più nuovo
              arr.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
              setProducts(arr);
            });

            // Live subscribe to orders collection = archivio ordini chiusi
            window.fb.onSnapshotCollection('orders', (snap) => {
              const arr = [];
              snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
              // Più recenti in cima (per data ordine, poi per momento di chiusura)
              arr.sort((a, b) => {
                const d = (b.date || '').localeCompare(a.date || '');
                if (d !== 0) return d;
                return (b.closedAt || '').localeCompare(a.closedAt || '');
              });
              setOrders(arr);
            });

            // Restore logged-in employee
            const localUser = localGet('hotel:current_user');
            if (localUser) {
              setCurrentUser(localUser);
              setScreen('dashboard');
            } else {
              setScreen('login');
            }
          } catch (err) {
            console.error('Firebase error:', err);
            setConnectionError(err.code || err.message || 'unknown');
          }
        })();
      }, [fbReady]);

      // Auto-update period every minute
      useEffect(() => {
        const id = setInterval(() => setActivePeriod(detectPeriod()), 60000);
        return () => clearInterval(id);
      }, []);

      // ============== HANDLERS ==============
      const handleLogin = (employee) => {
        setCurrentUser(employee);
        localSet('hotel:current_user', employee);
        setScreen('dashboard');
      };

      const handleLogout = () => {
        setScreen('login');
        setCurrentUser(null);
        localDel('hotel:current_user');
      };

      // Toggle a single task — uses Firestore field-level update.
      // No race condition: each task is its own field, writes don't interfere.
      // For interval-frequency tasks, also updates lastDone on the task config
      // so the next "due" date slides forward from the moment it was actually completed.
      // The (period, area) args identify which slot is being toggled — needed for tasks
      // marked as "independent" (one check per period+area combo).
      const handleToggleTask = async (taskId, period, area) => {
        if (!currentUser) return;
        const path = `days/${todayKey()}`;
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        const key = slotKey(task, period, area);
        const isDone = dayState[key]?.done;
        const isInterval = task?.frequency?.type === 'interval';
        // Interval lastDone is updated only on the FIRST completion across all slots
        // of a given task on the same day (avoids resetting it multiple times).
        const synced = isTaskSynced(task);

        try {
          if (isDone) {
            // Untoggle: remove this slot from today's state
            await window.fb.setDoc(path, { [key]: window.fb.deleteField() }, { merge: true });
            // For interval tasks: restore the previous lastDone (kept on the slot entry)
            if (isInterval) {
              // Only restore lastDone if no OTHER slot of this task is still done today
              const stillDoneElsewhere = !synced && Object.entries(dayState).some(([k, v]) =>
                k !== key && k.startsWith(`${taskId}__`) && v?.done
              );
              if (!stillDoneElsewhere) {
                const prev = dayState[key]?.prevLastDone ?? null;
                const updatedTasks = tasks.map(t => t.id === taskId
                  ? { ...t, frequency: { ...t.frequency, lastDone: prev } }
                  : t
                );
                await window.fb.setDoc('app/config', { tasks: updatedTasks }, { merge: true });
              }
            }
          } else {
            const entry = {
              done: true,
              doneBy: currentUser.name,
              doneById: currentUser.id,
              doneAt: new Date().toISOString()
            };
            if (isInterval) {
              entry.prevLastDone = task.frequency.lastDone ?? null;
            }
            await window.fb.setDoc(path, { [key]: entry }, { merge: true });
            // For interval tasks: update lastDone on the task config
            if (isInterval) {
              const today = todayKey();
              const updatedTasks = tasks.map(t => t.id === taskId
                ? { ...t, frequency: { ...t.frequency, lastDone: today } }
                : t
              );
              await window.fb.setDoc('app/config', { tasks: updatedTasks }, { merge: true });
            }
          }
        } catch (err) {
          console.error('Toggle failed:', err);
          showToast('Errore di rete. Riprova.');
        }
      };

      const handleEnterAdmin = () => {
        setPinInput('');
        setPinError(false);
        setScreen('admin-pin');
      };

      const handlePinSubmit = () => {
        if (pinInput === adminPin) {
          setPinInput('');
          setPinError(false);
          setScreen('admin');
        } else {
          setPinError(true);
          setTimeout(() => setPinError(false), 600);
          setPinInput('');
        }
      };

      // Admin: employees
      const addEmployee = async (name) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        const newEmp = { id: `emp_${Date.now()}`, name: trimmed };
        const updated = [...employees, newEmp];
        await window.fb.setDoc('app/config', { employees: updated }, { merge: true });
        showToast('Dipendente aggiunto');
      };

      const removeEmployee = async (id) => {
        const updated = employees.filter(e => e.id !== id);
        await window.fb.setDoc('app/config', { employees: updated }, { merge: true });
        showToast('Dipendente rimosso');
      };

      // Admin: tasks
      const addTask = async (taskData) => {
        const newTask = { id: `t_${Date.now()}`, ...taskData };
        const updated = [...tasks, newTask];
        await window.fb.setDoc('app/config', { tasks: updated }, { merge: true });
        showToast('Mansione aggiunta');
      };

      const updateTask = async (id, taskData) => {
        const updated = tasks.map(t => t.id === id ? { ...t, ...taskData } : t);
        await window.fb.setDoc('app/config', { tasks: updated }, { merge: true });
        showToast('Mansione aggiornata');
      };

      const removeTask = async (id) => {
        const updated = tasks.filter(t => t.id !== id);
        await window.fb.setDoc('app/config', { tasks: updated }, { merge: true });
        showToast('Mansione rimossa');
      };

      const changePin = async (newPin) => {
        if (!/^\d{4}$/.test(newPin)) return false;
        await window.fb.setDoc('app/config', { pin: newPin }, { merge: true });
        showToast('PIN aggiornato');
        return true;
      };

      const resetDay = async () => {
        await window.fb.setDoc(`days/${todayKey()}`, {}, { merge: false });
        showToast('Giornata resettata');
      };

      // ============== NOTES HANDLERS ==============
      const createNote = async ({ text, important }) => {
        if (!currentUser) return;
        const id = `note_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        await window.fb.setDoc(`notes/${id}`, {
          text,
          important: !!important,
          createdBy: currentUser.name,
          createdById: currentUser.id,
          createdAt: new Date().toISOString(),
          closed: false,
          closedAt: null,
          closedBy: null,
          readBy: { [currentUser.id]: new Date().toISOString() } // author is auto-read
        }, { merge: false });
        showToast('Nota pubblicata');
      };

      const markNoteRead = async (noteId) => {
        if (!currentUser) return;
        const note = notes.find(n => n.id === noteId);
        if (!note) return;
        // Already read? skip
        if (note.readBy && note.readBy[currentUser.id]) return;
        await window.fb.setDoc(`notes/${noteId}`, {
          readBy: { ...(note.readBy || {}), [currentUser.id]: new Date().toISOString() }
        }, { merge: true });
      };

      const closeNote = async (noteId) => {
        if (!currentUser) return;
        await window.fb.setDoc(`notes/${noteId}`, {
          closed: true,
          closedAt: new Date().toISOString(),
          closedBy: currentUser.name
        }, { merge: true });
        showToast('Nota chiusa');
      };

      const reopenNote = async (noteId) => {
        if (!currentUser) return;
        await window.fb.setDoc(`notes/${noteId}`, {
          closed: false,
          closedAt: null,
          closedBy: null
        }, { merge: true });
        showToast('Nota riaperta');
      };

      const deleteNote = async (noteId) => {
        await window.fb.deleteDoc(`notes/${noteId}`);
        showToast('Nota eliminata');
      };

      // ============== ORDINI: RIGHE DELL'ORDINE IN CORSO ==============
      // Ogni documento in `products` è una riga della tabella dell'ordine aperto.
      // Schema riga: { name, qty, unit, createdBy, createdById, createdAt }

      // Crea una riga vuota e restituisce il suo id (serve per metterci il cursore)
      const addProductRow = async () => {
        if (!currentUser) return null;
        const id = `prod_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        await window.fb.setDoc(`products/${id}`, {
          name: '',
          qty: '',
          unit: 'ct',
          createdBy: currentUser.name,
          createdById: currentUser.id,
          createdAt: new Date().toISOString()
        }, { merge: false });
        return id;
      };

      // Aggiorna una singola cella (chiamato all'uscita dal campo)
      const updateProductRow = async (productId, patch) => {
        await window.fb.setDoc(`products/${productId}`, patch, { merge: true });
      };

      const deleteProduct = async (productId) => {
        await window.fb.deleteDoc(`products/${productId}`);
      };

      // Chiude l'ordine: archivia tutte le righe compilate e svuota la tabella
      const closeOrder = async ({ date, supplier }) => {
        if (!currentUser) return false;
        const items = products
          .map(p => ({
            name: (p.name || '').trim(),
            qty: (p.qty || '').trim(),
            unit: (p.unit || '').trim()
          }))
          .filter(i => i.name.length > 0);

        if (items.length === 0) {
          showToast('Nessun prodotto da archiviare');
          return false;
        }

        const id = `ord_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        await window.fb.setDoc(`orders/${id}`, {
          date: date || todayKey(),
          supplier: (supplier || '').trim(),
          items,
          closedBy: currentUser.name,
          closedById: currentUser.id,
          closedAt: new Date().toISOString()
        }, { merge: false });

        // Svuota la tabella dell'ordine in corso
        await Promise.all(products.map(p => window.fb.deleteDoc(`products/${p.id}`)));
        showToast(`Ordine archiviato · ${items.length} prodotti`);
        return true;
      };

      const deleteOrder = async (orderId) => {
        await window.fb.deleteDoc(`orders/${orderId}`);
        showToast('Ordine eliminato dall’archivio');
      };

      // Badge dashboard: righe compilate nell'ordine in corso
      const pendingProductsCount = products.filter(p => (p.name || '').trim().length > 0).length;

      // Count unread notes for current user (only active, not authored by self optional)
      const unreadCount = currentUser
        ? notes.filter(n => !n.closed && !(n.readBy && n.readBy[currentUser.id])).length
        : 0;

      // ============== RENDER ==============
      if (connectionError === 'config') {
        return <ConfigErrorScreen />;
      }
      if (connectionError) {
        return <FirebaseErrorScreen error={connectionError} />;
      }
      if (!fbReady || screen === 'loading') {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-stone-400 text-sm tracking-wide">Caricamento…</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen text-stone-900 antialiased">
          {screen === 'login' && (
            <LoginScreen employees={employees} onLogin={handleLogin} onAdmin={handleEnterAdmin} />
          )}
          {screen === 'dashboard' && currentUser && (
            <Dashboard
              user={currentUser}
              tasks={tasks}
              dayState={dayState}
              activePeriod={activePeriod}
              setActivePeriod={setActivePeriod}
              onToggle={handleToggleTask}
              onLogout={handleLogout}
              onAdmin={handleEnterAdmin}
              unreadCount={unreadCount}
              onOpenNotes={() => setScreen('notes')}
              onOpenProducts={() => setScreen('products')}
              pendingProductsCount={pendingProductsCount}
            />
          )}
          {screen === 'products' && currentUser && (
            <OrdersScreen
              user={currentUser}
              products={products}
              orders={orders}
              tab={ordersTab}
              setTab={setOrdersTab}
              onAddRow={addProductRow}
              onUpdateRow={updateProductRow}
              onDeleteRow={deleteProduct}
              onCloseOrder={closeOrder}
              onDeleteOrder={deleteOrder}
              onToast={showToast}
              onExit={() => setScreen('dashboard')}
            />
          )}
          {screen === 'notes' && currentUser && (
            <NotesScreen
              user={currentUser}
              notes={notes}
              tab={notesTab}
              setTab={setNotesTab}
              onMarkRead={markNoteRead}
              onClose={closeNote}
              onReopen={reopenNote}
              onDelete={deleteNote}
              onCreate={createNote}
              onExit={() => setScreen('dashboard')}
            />
          )}
          {screen === 'admin-pin' && (
            <PinScreen
              pin={pinInput}
              setPin={setPinInput}
              error={pinError}
              onSubmit={handlePinSubmit}
              onCancel={() => setScreen(currentUser ? 'dashboard' : 'login')}
            />
          )}
          {screen === 'admin' && (
            <AdminPanel
              tab={adminTab}
              setTab={setAdminTab}
              employees={employees}
              tasks={tasks}
              dayState={dayState}
              adminPin={adminPin}
              onAddEmployee={addEmployee}
              onRemoveEmployee={removeEmployee}
              onAddTask={addTask}
              onUpdateTask={updateTask}
              onRemoveTask={removeTask}
              onChangePin={changePin}
              onResetDay={resetDay}
              onExit={() => setScreen(currentUser ? 'dashboard' : 'login')}
            />
          )}
          {toast && (
            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 animate-fade-in">
              <div className="bg-stone-900/90 backdrop-blur-xl text-white text-sm px-5 py-3 rounded-2xl shadow-2xl">{toast}</div>
            </div>
          )}
        </div>
      );
    }

    function firebaseConfigPlaceholder() {
      // Read flag set by the module that initialized firebaseConfig
      return window.fbConfigValid === false;
    }

    function ConfigErrorScreen() {
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-md bg-white rounded-3xl border border-stone-200/60 shadow-sm p-8 animate-scale-in">
            <div className="w-12 h-12 rounded-2xl bg-amber-100 flex items-center justify-center mb-4">
              <Icon name="alert" className="w-6 h-6 text-amber-600" />
            </div>
            <h1 className="text-xl font-semibold tracking-tight mb-2">Configurazione Firebase mancante</h1>
            <p className="text-sm text-stone-600 leading-relaxed mb-3">
              Apri <code className="bg-stone-100 px-1.5 py-0.5 rounded text-xs">index.html</code> e sostituisci
              i valori <code className="bg-stone-100 px-1.5 py-0.5 rounded text-xs">PASTE_YOUR_*</code> con
              quelli del tuo progetto Firebase.
            </p>
            <p className="text-sm text-stone-600 leading-relaxed">
              Vedi il <strong>README.md</strong> della repo per la guida passo-passo.
            </p>
          </div>
        </div>
      );
    }

    function FirebaseErrorScreen({ error }) {
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-md bg-white rounded-3xl border border-stone-200/60 shadow-sm p-8">
            <div className="w-12 h-12 rounded-2xl bg-red-100 flex items-center justify-center mb-4">
              <Icon name="alert" className="w-6 h-6 text-red-600" />
            </div>
            <h1 className="text-xl font-semibold tracking-tight mb-2">Errore di connessione</h1>
            <p className="text-sm text-stone-600 leading-relaxed mb-2">
              Impossibile connettersi a Firebase. Possibili cause:
            </p>
            <ul className="text-sm text-stone-600 space-y-1 mb-3 list-disc pl-5">
              <li>Connessione internet assente</li>
              <li>Regole Firestore troppo restrittive (vedi README)</li>
              <li>Configurazione errata in index.html</li>
            </ul>
            <code className="block bg-stone-100 p-3 rounded-lg text-xs text-stone-700 break-all">{error}</code>
          </div>
        </div>
      );
    }

    // ============== LOGIN SCREEN ==============
    function LoginScreen({ employees, onLogin, onAdmin }) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6">
          <div className="w-full max-w-md animate-scale-in">
            <div className="text-center mb-10">
              <img src="icons/icon-192.png" alt="Ciao Bella" className="w-20 h-20 mx-auto mb-5 rounded-full shadow-md" />
              <div className="t-11 font-medium text-stone-500 tracking-widest uppercase mb-3">Ciao Bella</div>
              <h1 className="text-4xl font-semibold tracking-tight text-stone-900">{greeting()}</h1>
              <p className="text-stone-500 mt-2 text-base">Seleziona il tuo nome per iniziare</p>
            </div>
            <div className="bg-white rounded-3xl shadow-sm border border-stone-200/60 overflow-hidden">
              {employees.length === 0 ? (
                <div className="p-10 text-center text-stone-400 text-sm">
                  Nessun dipendente registrato.<br />Accedi come admin per aggiungerne.
                </div>
              ) : employees.map((emp, i) => (
                <button
                  key={emp.id}
                  onClick={() => onLogin(emp)}
                  className="w-full flex items-center justify-between px-6 py-4 hover:bg-stone-50 active:bg-stone-100 transition-colors text-left"
                  style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}
                >
                  <div className="flex items-center gap-4">
                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-stone-200 to-stone-300 flex items-center justify-center text-stone-700 font-medium">
                      {emp.name.split(' ').map(n => n[0]).slice(0, 2).join('')}
                    </div>
                    <div className="font-medium text-stone-900">{emp.name}</div>
                  </div>
                  <Icon name="chevronright" className="w-5 h-5 text-stone-300" />
                </button>
              ))}
            </div>
            <button onClick={onAdmin} className="w-full mt-6 flex items-center justify-center gap-2 py-3.5 text-stone-500 hover:text-stone-900 transition-colors text-sm font-medium">
              <Icon name="lock" className="w-4 h-4" /> Accesso amministratore
            </button>
          </div>
        </div>
      );
    }

    // ============== PIN SCREEN ==============
    function PinScreen({ pin, setPin, error, onSubmit, onCancel }) {
      useEffect(() => {
        if (pin.length === 4) { const t = setTimeout(onSubmit, 150); return () => clearTimeout(t); }
      }, [pin, onSubmit]);
      const handleKey = (k) => {
        if (k === 'del') setPin(pin.slice(0, -1));
        else if (pin.length < 4) setPin(pin + k);
      };
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6">
          <div className="w-full max-w-xs animate-scale-in">
            <button onClick={onCancel} className="mb-8 flex items-center gap-1 text-stone-500 hover:text-stone-900 text-sm">
              <Icon name="chevronleft" className="w-4 h-4" /> Indietro
            </button>
            <div className="text-center mb-10">
              <div className="w-14 h-14 rounded-2xl bg-stone-900 flex items-center justify-center mx-auto mb-5">
                <Icon name="lock" className="w-6 h-6 text-white" />
              </div>
              <h2 className="text-2xl font-semibold tracking-tight">Inserisci PIN</h2>
              <p className="text-stone-500 text-sm mt-1">Accesso amministratore</p>
            </div>
            <div className={`flex justify-center gap-3 mb-12 ${error ? 'animate-shake' : ''}`}>
              {[0, 1, 2, 3].map(i => (
                <div key={i} className="w-4 h-4 rounded-full transition-all"
                     style={{ backgroundColor: error ? '#FF3B30' : (i < pin.length ? '#1d1d1f' : 'transparent'),
                              border: i < pin.length || error ? 'none' : '2px solid #d6d3d1' }} />
              ))}
            </div>
            <div className="grid grid-cols-3 gap-3">
              {keys.map((k, i) => (
                k === '' ? <div key={i} /> : (
                  <button key={i} onClick={() => handleKey(k)}
                          className="aspect-square rounded-2xl bg-white hover:bg-stone-100 active:bg-stone-200 transition-colors text-2xl font-light text-stone-900 shadow-sm border border-stone-200/60 flex items-center justify-center">
                    {k === 'del' ? <Icon name="chevronleft" className="w-6 h-6" /> : k}
                  </button>
                )
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ============== DASHBOARD ==============
    function Dashboard({ user, tasks, dayState, activePeriod, setActivePeriod, onToggle, onLogout, onAdmin, unreadCount, onOpenNotes, onOpenProducts, pendingProductsCount }) {
      const periodTasks = tasks.filter(t => taskInPeriod(t, activePeriod));
      // Each task can occupy multiple areas. Build a flat list of (task, area) "slots"
      // that are due in the active period. For synced tasks we still get one row per area
      // but the same dayState key, so they share a check.
      const periodSlots = [];
      periodTasks.forEach(t => {
        const areas = getTaskAreas(t);
        areas.forEach(a => periodSlots.push({ task: t, area: a }));
      });

      // Progress: count slots due today only
      const dueSlots = periodSlots.filter(({ task }) => isTaskDue(task));
      const doneSlots = dueSlots.filter(({ task, area }) => dayState[slotKey(task, activePeriod, area)]?.done);
      const totalForPeriod = dueSlots.length;
      const doneForPeriod = doneSlots.length;
      const progressPct = totalForPeriod ? Math.round((doneForPeriod / totalForPeriod) * 100) : 0;

      return (
        <div className="min-h-screen pb-20">
          <div className="px-5 pt-12 pb-6 max-w-2xl mx-auto">
            <div className="flex items-center justify-between mb-6">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-stone-200 to-stone-300 flex items-center justify-center text-stone-700 text-sm font-medium">
                  {user.name.split(' ').map(n => n[0]).slice(0, 2).join('')}
                </div>
                <div className="text-left">
                  <div className="t-11 text-stone-500 uppercase tracking-wider leading-none">Operatore</div>
                  <div className="text-sm font-medium text-stone-900 leading-tight">{user.name}</div>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={onOpenNotes} className="relative w-9 h-9 rounded-full bg-white shadow-sm border border-stone-200/60 flex items-center justify-center hover:bg-stone-50 transition-colors" title="Note">
                  <Icon name="bell" className="w-4 h-4 text-stone-600" />
                  {unreadCount > 0 && (
                    <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white">
                      {unreadCount > 9 ? '9+' : unreadCount}
                    </span>
                  )}
                </button>
                <button onClick={onOpenProducts} className="relative w-9 h-9 rounded-full bg-white shadow-sm border border-stone-200/60 flex items-center justify-center hover:bg-stone-50 transition-colors" title="Ordini">
                  <Icon name="cart" className="w-4 h-4 text-stone-600" />
                  {pendingProductsCount > 0 && (
                    <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-orange-500 text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white">
                      {pendingProductsCount > 9 ? '9+' : pendingProductsCount}
                    </span>
                  )}
                </button>
                <button onClick={onAdmin} className="w-9 h-9 rounded-full bg-white shadow-sm border border-stone-200/60 flex items-center justify-center hover:bg-stone-50 transition-colors" title="Admin">
                  <Icon name="settings" className="w-4 h-4 text-stone-600" />
                </button>
                <button onClick={onLogout} className="w-9 h-9 rounded-full bg-white shadow-sm border border-stone-200/60 flex items-center justify-center hover:bg-stone-50 transition-colors" title="Esci">
                  <Icon name="logout" className="w-4 h-4 text-stone-600" />
                </button>
              </div>
            </div>
            <div className="mb-2 flex items-start justify-between gap-3">
              <div className="flex-1 min-w-0">
                <div className="t-11 uppercase tracking-widest text-stone-500 font-medium">{formatDateLong(todayKey())}</div>
                <h1 className="text-3xl font-semibold tracking-tight mt-1">
                  {greeting()}, <span className="text-stone-500">{user.name.split(' ')[0]}</span>
                </h1>
                <div className="t-11 text-stone-400 mt-1.5 flex items-center gap-1">
                  <span className="inline-block w-1.5 h-1.5 rounded-full bg-green-500"></span>
                  Sincronizzato in tempo reale
                </div>
              </div>
              <img src="icons/icon-192.png" alt="Ciao Bella" className="w-12 h-12 rounded-full shadow-sm flex-shrink-0 mt-1" />
            </div>
            <div className="mt-5 bg-white rounded-2xl p-4 border border-stone-200/60 shadow-sm">
              <div className="flex items-center justify-between mb-2.5">
                <div className="text-sm font-medium text-stone-900">Avanzamento {PERIODS.find(p => p.id === activePeriod)?.label.toLowerCase()}</div>
                <div className="text-sm text-stone-500"><span className="font-semibold text-stone-900">{doneForPeriod}</span> / {totalForPeriod}</div>
              </div>
              <div className="h-1.5 bg-stone-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500"
                     style={{ width: `${progressPct}%`, backgroundColor: progressPct === 100 ? '#34C759' : '#1d1d1f' }} />
              </div>
            </div>
          </div>
          <div className="px-5 max-w-2xl mx-auto mb-6">
            <div className="bg-stone-200/70 rounded-2xl p-1 flex">
              {PERIODS.map(p => {
                const isActive = activePeriod === p.id;
                return (
                  <button key={p.id} onClick={() => setActivePeriod(p.id)}
                          className={`flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-sm font-medium transition-all ${isActive ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-600'}`}>
                    <Icon name={p.id === 'mattina' ? 'sun' : p.id === 'pomeriggio' ? 'cloud' : 'moon'} className="w-4 h-4" />
                    {p.label}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="px-5 max-w-2xl mx-auto space-y-6">
            {AREAS.map(area => {
              const areaTasks = periodTasks.filter(t => taskInArea(t, area.id));
              // Count only tasks DUE today for the area progress
              const areaDueTasks = areaTasks.filter(t => isTaskDue(t));
              const areaDone = areaDueTasks.filter(t => dayState[slotKey(t, activePeriod, area.id)]?.done).length;
              return (
                <div key={area.id}>
                  <div className="flex items-center justify-between px-1 mb-2.5">
                    <div className="flex items-center gap-2">
                      <Icon name={area.id === 'sala' ? 'utensils' : area.id === 'bar' ? 'coffee' : 'clipboard'}
                            className="w-4 h-4" strokeWidth={2.5} />
                      <h2 className="text-base font-semibold text-stone-900 tracking-tight" style={{ color: area.color }}>{area.label}</h2>
                    </div>
                    <div className="text-xs text-stone-500 font-medium">{areaDone}/{areaDueTasks.length}</div>
                  </div>
                  {areaTasks.length === 0 ? (
                    <div className="bg-white rounded-2xl p-5 text-center text-stone-400 text-sm border border-stone-200/60">
                      Nessuna mansione per questo turno
                    </div>
                  ) : (
                    <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
                      {areaTasks.map((t, i) => {
                        const key = slotKey(t, activePeriod, area.id);
                        const state = dayState[key];
                        const done = state?.done;
                        const due = isTaskDue(t);
                        const freqLbl = frequencyLabel(t);
                        const synced = isTaskSynced(t);
                        const taskAreas = getTaskAreas(t);
                        const taskPeriods = getTaskPeriods(t);
                        // Show "multi" badge when this task spans more than one slot AND is synced
                        // (so the user understands ticking here also marks elsewhere)
                        const multiSlot = synced && (taskAreas.length > 1 || taskPeriods.length > 1);
                        return (
                          <button
                            key={t.id}
                            onClick={() => onToggle(t.id, activePeriod, area.id)}
                            className="w-full px-4 py-3.5 flex items-start gap-3 transition-colors text-left hover:bg-stone-50 active:bg-stone-100"
                            style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                            <div className="mt-0.5 w-6 h-6 rounded-full flex items-center justify-center transition-all flex-shrink-0"
                                 style={{ backgroundColor: done ? '#34C759' : 'transparent', border: done ? 'none' : '2px solid #d6d3d1' }}>
                              {done && <Icon name="check" className="w-3.5 h-3.5 text-white" strokeWidth={3} />}
                            </div>
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2 flex-wrap">
                                <div className={`font-medium t-15 leading-snug ${done ? 'text-stone-400 line-through' : 'text-stone-900'}`}>{t.title}</div>
                                {freqLbl && (
                                  <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-blue-50 text-blue-700 flex-shrink-0">
                                    {freqLbl}
                                  </span>
                                )}
                                {freqLbl && due && !done && (
                                  <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-green-50 text-green-700 flex-shrink-0">
                                    Da fare oggi
                                  </span>
                                )}
                                {multiSlot && (
                                  <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-amber-50 text-amber-700 flex-shrink-0" title="Una sola spunta vale per tutti i turni/aree">
                                    Condivisa
                                  </span>
                                )}
                              </div>
                              {t.desc && <div className={`t-13 mt-0.5 ${done ? 'text-stone-300' : 'text-stone-500'}`}>{t.desc}</div>}
                              {done && state && (
                                <div className="flex items-center gap-1.5 mt-1.5 t-11 text-stone-500">
                                  <Icon name="check" className="w-3 h-3" strokeWidth={3} />
                                  <span className="font-medium">{state.doneBy}</span>
                                  <span>·</span>
                                  <span>{formatTime(state.doneAt)}</span>
                                </div>
                              )}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ============== ADMIN PANEL ==============
    function AdminPanel(props) {
      const { tab, setTab, onExit } = props;
      const tabs = [
        { id: 'tasks', label: 'Mansioni', icon: 'list' },
        { id: 'employees', label: 'Dipendenti', icon: 'users' },
        { id: 'history', label: 'Storico', icon: 'history' },
        { id: 'settings', label: 'Impostazioni', icon: 'shield' }
      ];
      return (
        <div className="min-h-screen pb-20">
          <div className="bg-white border-b border-stone-200/60 sticky top-0 z-30 backdrop-blur-xl bg-white/80">
            <div className="max-w-2xl mx-auto px-5 pt-12 pb-3 flex items-center justify-between">
              <button onClick={onExit} className="flex items-center gap-1 text-stone-700 hover:text-stone-900">
                <Icon name="chevronleft" className="w-5 h-5" /> <span className="text-base">Chiudi</span>
              </button>
              <div className="flex items-center gap-2">
                <img src="icons/icon-192.png" alt="" className="w-6 h-6 rounded-full" />
                <div className="text-base font-semibold tracking-tight">Amministrazione</div>
              </div>
              <div className="w-16" />
            </div>
            <div className="max-w-2xl mx-auto px-5 pb-3 overflow-x-auto no-scrollbar">
              <div className="flex gap-1.5">
                {tabs.map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                          className={`flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${tab === t.id ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}`}>
                    <Icon name={t.icon} className="w-3.5 h-3.5" /> {t.label}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="max-w-2xl mx-auto px-5 pt-6 animate-scale-in">
            {tab === 'tasks' && <TasksManager {...props} />}
            {tab === 'employees' && <EmployeesManager {...props} />}
            {tab === 'history' && <HistoryViewer {...props} />}
            {tab === 'settings' && <SettingsPanel {...props} />}
          </div>
        </div>
      );
    }

    function TasksManager({ tasks, onAddTask, onUpdateTask, onRemoveTask }) {
      const [showForm, setShowForm] = useState(false);
      const [editing, setEditing] = useState(null);
      const [filterPeriod, setFilterPeriod] = useState('all');
      const [filterArea, setFilterArea] = useState('all');
      const filtered = tasks.filter(t => (filterPeriod === 'all' || t.period === filterPeriod) && (filterArea === 'all' || t.area === filterArea));
      return (
        <div>
          <div className="flex gap-2 mb-4 overflow-x-auto pb-1 no-scrollbar">
            <FilterChip label="Tutti i turni" active={filterPeriod === 'all'} onClick={() => setFilterPeriod('all')} />
            {PERIODS.map(p => <FilterChip key={p.id} label={p.label} active={filterPeriod === p.id} onClick={() => setFilterPeriod(p.id)} />)}
          </div>
          <div className="flex gap-2 mb-5 overflow-x-auto pb-1 no-scrollbar">
            <FilterChip label="Tutte le aree" active={filterArea === 'all'} onClick={() => setFilterArea('all')} />
            {AREAS.map(a => <FilterChip key={a.id} label={a.label} active={filterArea === a.id} onClick={() => setFilterArea(a.id)} />)}
          </div>
          <button onClick={() => { setEditing(null); setShowForm(true); }}
                  className="w-full mb-4 py-3 bg-stone-900 text-white rounded-2xl font-medium flex items-center justify-center gap-2 hover:bg-stone-800 transition-colors">
            <Icon name="plus" className="w-4 h-4" /> Nuova mansione
          </button>
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
            {filtered.length === 0 ? (
              <div className="p-8 text-center text-stone-400 text-sm">Nessuna mansione</div>
            ) : filtered.map((t, i) => {
              const area = AREAS.find(a => a.id === t.area);
              const period = PERIODS.find(p => p.id === t.period);
              return (
                <div key={t.id} className="px-4 py-3 flex items-start gap-3" style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                  <div className="flex-1 min-w-0">
                    <div className="font-medium t-15 text-stone-900 leading-snug">{t.title}</div>
                    {t.desc && <div className="t-13 text-stone-500 mt-0.5">{t.desc}</div>}
                    <div className="flex gap-1.5 mt-2 flex-wrap">
                      <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md" style={{ backgroundColor: `${area?.color}15`, color: area?.color }}>{area?.label}</span>
                      <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-stone-100 text-stone-600">{period?.label}</span>
                      {frequencyLabel(t) && (
                        <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-blue-50 text-blue-700">
                          {frequencyLabel(t)}
                        </span>
                      )}
                    </div>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => { setEditing(t); setShowForm(true); }} className="w-8 h-8 rounded-lg hover:bg-stone-100 flex items-center justify-center text-stone-500"><Icon name="edit" className="w-4 h-4" /></button>
                    <button onClick={() => { if (confirm(`Rimuovere "${t.title}"?`)) onRemoveTask(t.id); }} className="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center text-red-500"><Icon name="trash" className="w-4 h-4" /></button>
                  </div>
                </div>
              );
            })}
          </div>
          {showForm && <TaskFormModal initial={editing} onSave={(data) => { if (editing) onUpdateTask(editing.id, data); else onAddTask(data); setShowForm(false); }} onClose={() => setShowForm(false)} />}
        </div>
      );
    }

    function TaskFormModal({ initial, onSave, onClose }) {
      const [title, setTitle] = useState(initial?.title || '');
      const [desc, setDesc] = useState(initial?.desc || '');
      // Areas/periods: arrays. Read from new schema first, fall back to legacy singular.
      const [areas, setAreas] = useState(
        initial ? getTaskAreas(initial) : ['sala']
      );
      const [periods, setPeriods] = useState(
        initial ? getTaskPeriods(initial) : ['mattina']
      );
      const [synced, setSynced] = useState(
        initial ? isTaskSynced(initial) : true
      );

      // Frequency state — initialized from existing task or defaulted to "daily"
      const initFreq = initial?.frequency || { type: 'daily' };
      const [freqType, setFreqType] = useState(initFreq.type || 'daily');
      const [freqWeekdays, setFreqWeekdays] = useState(
        initFreq.type === 'weekdays' ? (initFreq.days || []) : [1, 2, 3, 4, 5]
      );
      const [freqInterval, setFreqInterval] = useState(
        initFreq.type === 'interval' ? (initFreq.days || 7) : 7
      );

      const canSave =
        title.trim().length > 0 &&
        areas.length > 0 &&
        periods.length > 0 &&
        (freqType !== 'weekdays' || freqWeekdays.length > 0) &&
        (freqType !== 'interval' || freqInterval >= 1);

      const toggleArea = (id) => {
        setAreas(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };
      const togglePeriod = (id) => {
        setPeriods(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };
      const toggleWeekday = (d) => {
        setFreqWeekdays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d].sort());
      };

      const buildFrequency = () => {
        if (freqType === 'daily') return { type: 'daily' };
        if (freqType === 'weekdays') return { type: 'weekdays', days: freqWeekdays };
        if (freqType === 'interval') {
          const lastDone = initial?.frequency?.type === 'interval' ? (initial.frequency.lastDone ?? null) : null;
          return { type: 'interval', days: parseInt(freqInterval, 10) || 1, lastDone };
        }
        return { type: 'daily' };
      };

      // Total slots that will appear on the dashboard for this task
      const totalSlots = areas.length * periods.length;
      const showSyncOption = totalSlots > 1;

      return (
        <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-sm p-0 sm:p-6 animate-fade-in">
          <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 animate-scale-in max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-5">
              <div className="text-lg font-semibold tracking-tight">{initial ? 'Modifica mansione' : 'Nuova mansione'}</div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 hover:bg-stone-200"><Icon name="x" className="w-4 h-4" /></button>
            </div>
            <div className="space-y-4">
              <Field label="Titolo">
                <input autoFocus value={title} onChange={e => setTitle(e.target.value)} placeholder="Es. Apertura sala colazioni"
                       className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:bg-stone-50 focus:ring-2 focus:ring-stone-900" />
              </Field>
              <Field label="Descrizione (opzionale)">
                <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={2} placeholder="Dettagli o note operative"
                          className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:bg-stone-50 focus:ring-2 focus:ring-stone-900 resize-none" />
              </Field>
              <Field label="Area (selezione multipla)">
                <div className="grid grid-cols-3 gap-2">
                  {AREAS.map(a => (
                    <button key={a.id} onClick={() => toggleArea(a.id)}
                            className={`py-2.5 rounded-xl text-sm font-medium transition-all ${areas.includes(a.id) ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                      {a.label}
                    </button>
                  ))}
                </div>
                {areas.length === 0 && <div className="t-11 text-red-500 mt-1">Seleziona almeno un'area</div>}
              </Field>
              <Field label="Turno (selezione multipla)">
                <div className="grid grid-cols-3 gap-2">
                  {PERIODS.map(p => (
                    <button key={p.id} onClick={() => togglePeriod(p.id)}
                            className={`py-2.5 rounded-xl text-sm font-medium transition-all ${periods.includes(p.id) ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                      {p.label}
                    </button>
                  ))}
                </div>
                {periods.length === 0 && <div className="t-11 text-red-500 mt-1">Seleziona almeno un turno</div>}
              </Field>

              {showSyncOption && (
                <Field label={`Modalità (${totalSlots} occorrenze)`}>
                  <div className="grid grid-cols-2 gap-2 mb-2">
                    <button onClick={() => setSynced(true)}
                            className={`py-2.5 px-2 rounded-xl text-xs font-medium transition-all ${synced ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                      Sincronizzata
                    </button>
                    <button onClick={() => setSynced(false)}
                            className={`py-2.5 px-2 rounded-xl text-xs font-medium transition-all ${!synced ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                      Indipendente
                    </button>
                  </div>
                  <div className="t-11 text-stone-500">
                    {synced
                      ? `Una sola spunta vale per tutte le ${totalSlots} occorrenze (turno × area).`
                      : `Ognuna delle ${totalSlots} occorrenze va spuntata separatamente.`}
                  </div>
                </Field>
              )}

              <Field label="Frequenza">
                <div className="grid grid-cols-3 gap-2 mb-3">
                  <button onClick={() => setFreqType('daily')} className={`py-2.5 rounded-xl text-sm font-medium transition-all ${freqType === 'daily' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>Ogni giorno</button>
                  <button onClick={() => setFreqType('weekdays')} className={`py-2.5 rounded-xl text-sm font-medium transition-all ${freqType === 'weekdays' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>Giorni fissi</button>
                  <button onClick={() => setFreqType('interval')} className={`py-2.5 rounded-xl text-sm font-medium transition-all ${freqType === 'interval' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>Ogni N giorni</button>
                </div>

                {freqType === 'weekdays' && (
                  <div>
                    <div className="grid grid-cols-7 gap-1.5 mb-2">
                      {[1, 2, 3, 4, 5, 6, 0].map(d => (
                        <button key={d} onClick={() => toggleWeekday(d)}
                                className={`py-2 rounded-lg text-xs font-medium transition-all ${freqWeekdays.includes(d) ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                          {WEEKDAY_LABELS[d]}
                        </button>
                      ))}
                    </div>
                    <div className="t-11 text-stone-500">
                      {freqWeekdays.length === 0 ? 'Seleziona almeno un giorno' :
                        freqWeekdays.length === 7 ? 'Tutti i giorni della settimana' :
                        `Solo ${freqWeekdays.map(d => WEEKDAY_LABELS_FULL[d]).join(', ')}`}
                    </div>
                  </div>
                )}

                {freqType === 'interval' && (
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-sm text-stone-600">Ogni</span>
                      <input type="number" inputMode="numeric" min="1" max="365" value={freqInterval}
                             onChange={e => setFreqInterval(e.target.value.replace(/\D/g, ''))}
                             className="w-20 px-3 py-2 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900 text-center" />
                      <span className="text-sm text-stone-600">giorni</span>
                    </div>
                    <div className="flex gap-1.5 mt-2 flex-wrap">
                      {[2, 3, 7, 14, 30].map(n => (
                        <button key={n} onClick={() => setFreqInterval(n)}
                                className={`px-2.5 py-1 rounded-md t-11 font-medium transition-all ${parseInt(freqInterval, 10) === n ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                          {n === 7 ? 'settimanale' : n === 14 ? 'quindicinale' : n === 30 ? 'mensile' : `ogni ${n}gg`}
                        </button>
                      ))}
                    </div>
                    <div className="t-11 text-stone-500 mt-2">
                      L'intervallo riparte ogni volta che la mansione viene completata.
                      {initial?.frequency?.type === 'interval' && initial.frequency.lastDone && (
                        <> Ultima esecuzione: {formatDateLong(initial.frequency.lastDone)}.</>
                      )}
                    </div>
                  </div>
                )}
              </Field>
            </div>
            <div className="flex gap-2 mt-6">
              <button onClick={onClose} className="flex-1 py-3 bg-stone-100 text-stone-700 rounded-xl font-medium hover:bg-stone-200">Annulla</button>
              <button onClick={() => onSave({
                        title: title.trim(),
                        desc: desc.trim(),
                        areas,
                        periods,
                        synced: totalSlots > 1 ? synced : true,
                        frequency: buildFrequency()
                      })} disabled={!canSave}
                      className="flex-1 py-3 bg-stone-900 text-white rounded-xl font-medium disabled:opacity-30 disabled:cursor-not-allowed hover:bg-stone-800">Salva</button>
            </div>
          </div>
        </div>
      );
    }

    function EmployeesManager({ employees, onAddEmployee, onRemoveEmployee }) {
      const [name, setName] = useState('');
      const submit = () => { if (!name.trim()) return; onAddEmployee(name); setName(''); };
      return (
        <div>
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm p-3 mb-4 flex gap-2">
            <input value={name} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="Nome dipendente"
                   className="flex-1 px-3 py-2 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900" />
            <button onClick={submit} disabled={!name.trim()} className="px-4 py-2 bg-stone-900 text-white rounded-xl text-sm font-medium disabled:opacity-30 hover:bg-stone-800 flex items-center gap-1">
              <Icon name="plus" className="w-4 h-4" /> Aggiungi
            </button>
          </div>
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
            {employees.length === 0 ? (
              <div className="p-8 text-center text-stone-400 text-sm">Nessun dipendente</div>
            ) : employees.map((emp, i) => (
              <div key={emp.id} className="px-4 py-3 flex items-center justify-between" style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-full bg-gradient-to-br from-stone-200 to-stone-300 flex items-center justify-center text-stone-700 text-sm font-medium">
                    {emp.name.split(' ').map(n => n[0]).slice(0, 2).join('')}
                  </div>
                  <div className="font-medium text-stone-900">{emp.name}</div>
                </div>
                <button onClick={() => { if (confirm(`Rimuovere ${emp.name}?`)) onRemoveEmployee(emp.id); }}
                        className="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center text-red-500"><Icon name="trash" className="w-4 h-4" /></button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function HistoryViewer({ tasks }) {
      const [selectedDate, setSelectedDate] = useState(todayKey());
      const [history, setHistory] = useState({});
      const [availableDates, setAvailableDates] = useState([todayKey()]);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState(null);
      const [reloadTick, setReloadTick] = useState(0);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const snap = await window.fb.getCollection('days');
            if (cancelled) return;
            const dates = snap.docs.map(d => d.id).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse();
            const all = dates.includes(todayKey()) ? dates : [todayKey(), ...dates];
            setAvailableDates(all);
          } catch (err) {
            if (cancelled) return;
            console.error('Failed to list days collection:', err);
            setAvailableDates([todayKey()]);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        let cancelled = false;
        let timeoutId = null;

        const load = async () => {
          setLoading(true);
          setErrorMsg(null);

          // Timeout safety net: if Firestore hangs, fail visibly after 10s
          // instead of spinning forever.
          const timeoutPromise = new Promise((_, reject) => {
            timeoutId = setTimeout(() => {
              reject(new Error('Timeout: Firestore non ha risposto entro 10 secondi. Controlla la connessione.'));
            }, 10000);
          });

          try {
            const snap = await Promise.race([
              window.fb.getDoc(`days/${selectedDate}`),
              timeoutPromise
            ]);
            if (cancelled) return;
            setHistory(snap.exists() ? (snap.data() || {}) : {});
          } catch (err) {
            if (cancelled) return;
            console.error('History load failed:', err);
            setHistory({});
            setErrorMsg(err.message || 'Errore sconosciuto durante il caricamento');
          } finally {
            if (timeoutId) clearTimeout(timeoutId);
            if (!cancelled) setLoading(false);
          }
        };

        load();

        return () => {
          cancelled = true;
          if (timeoutId) clearTimeout(timeoutId);
        };
      }, [selectedDate, reloadTick]);

      // Determine which tasks were "due" on the selected day:
      // - daily/no-frequency: always due
      // - weekdays: due if that day's DOW matches
      // - interval: due if there's an entry in history for it (we can't reconstruct
      //   the historical lastDone reliably, so we use the entry as proof of "due")
      const tasksDueThatDay = tasks.filter(t => {
        const freq = t.frequency;
        if (!freq || freq.type === 'daily') return true;
        if (freq.type === 'weekdays') {
          const dow = parseDate(selectedDate).getDay();
          return Array.isArray(freq.days) && freq.days.includes(dow);
        }
        if (freq.type === 'interval') {
          // Show only if there's a record for that day OR if it's today and currently due
          return !!history[t.id] || (selectedDate === todayKey() && isTaskDue(t, selectedDate));
        }
        return true;
      });

      const stats = {
        total: tasksDueThatDay.length,
        done: Object.keys(history).filter(id => tasksDueThatDay.some(t => t.id === id)).length,
        byEmployee: {}
      };
      Object.values(history).forEach(s => { if (s?.doneBy) stats.byEmployee[s.doneBy] = (stats.byEmployee[s.doneBy] || 0) + 1; });

      const handleDateClick = (d) => {
        if (d === selectedDate) {
          // Same date clicked: force reload manually
          setReloadTick(t => t + 1);
        } else {
          setSelectedDate(d);
        }
      };

      return (
        <div>
          <div className="mb-4 overflow-x-auto pb-1 no-scrollbar">
            <div className="flex gap-2">
              {availableDates.map(d => (
                <button key={d} onClick={() => handleDateClick(d)}
                        className={`px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-colors ${selectedDate === d ? 'bg-stone-900 text-white' : 'bg-white border border-stone-200/60 text-stone-700'}`}>
                  {d === todayKey() ? 'Oggi' : formatDateLong(d)}
                </button>
              ))}
            </div>
          </div>
          {loading ? <div className="text-center text-stone-400 py-10 text-sm">Caricamento…</div> : (
            <>
              {errorMsg && (
                <div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-4 text-sm text-red-700">
                  <div className="font-medium mb-1 flex items-center gap-2">
                    <Icon name="alert" className="w-4 h-4" /> Errore di caricamento
                  </div>
                  <div className="t-13 text-red-600">{errorMsg}</div>
                  <button onClick={() => setReloadTick(t => t + 1)} className="mt-2 text-red-700 underline text-xs font-medium">Riprova</button>
                </div>
              )}
              <div className="grid grid-cols-2 gap-3 mb-5">
                <div className="bg-white rounded-2xl p-4 border border-stone-200/60 shadow-sm">
                  <div className="t-11 uppercase tracking-wider text-stone-500 font-medium">Completate</div>
                  <div className="text-3xl font-semibold tracking-tight mt-1">{stats.done}<span className="text-base text-stone-400 font-normal">/{stats.total}</span></div>
                </div>
                <div className="bg-white rounded-2xl p-4 border border-stone-200/60 shadow-sm">
                  <div className="t-11 uppercase tracking-wider text-stone-500 font-medium">Operatori attivi</div>
                  <div className="text-3xl font-semibold tracking-tight mt-1">{Object.keys(stats.byEmployee).length}</div>
                </div>
              </div>
              {Object.keys(stats.byEmployee).length > 0 && (
                <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden mb-5">
                  <div className="px-4 py-2.5 t-11 uppercase tracking-wider text-stone-500 font-medium border-b border-stone-100">Per operatore</div>
                  {Object.entries(stats.byEmployee).sort((a, b) => b[1] - a[1]).map(([name, count], i) => (
                    <div key={name} className="px-4 py-3 flex items-center justify-between" style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                      <div className="font-medium t-15">{name}</div>
                      <div className="text-sm text-stone-500"><span className="font-semibold text-stone-900">{count}</span> mansioni</div>
                    </div>
                  ))}
                </div>
              )}
              <div className="space-y-4">
                {AREAS.map(area => {
                  const areaTasks = tasksDueThatDay.filter(t => t.area === area.id);
                  if (areaTasks.length === 0) return null;
                  return (
                    <div key={area.id}>
                      <div className="flex items-center gap-2 px-1 mb-2">
                        <Icon name={area.id === 'sala' ? 'utensils' : area.id === 'bar' ? 'coffee' : 'clipboard'} className="w-4 h-4" strokeWidth={2.5} />
                        <h3 className="font-semibold text-stone-900 text-sm" style={{ color: area.color }}>{area.label}</h3>
                      </div>
                      <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
                        {areaTasks.map((t, i) => {
                          const s = history[t.id];
                          const freqLbl = frequencyLabel(t);
                          return (
                            <div key={t.id} className="px-4 py-3" style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                              <div className="flex items-start gap-3">
                                <div className="w-5 h-5 mt-0.5 rounded-full flex items-center justify-center flex-shrink-0" style={{ backgroundColor: s?.done ? '#34C759' : '#e7e5e4' }}>
                                  {s?.done && <Icon name="check" className="w-3 h-3 text-white" strokeWidth={3} />}
                                </div>
                                <div className="flex-1 min-w-0">
                                  <div className={`text-sm font-medium ${s?.done ? 'text-stone-900' : 'text-stone-400'}`}>{t.title}</div>
                                  {s?.done ? (
                                    <div className="t-11 text-stone-500 mt-0.5">{s.doneBy} · {formatTime(s.doneAt)}</div>
                                  ) : (
                                    <div className="t-11 text-stone-400 mt-0.5">Non eseguita</div>
                                  )}
                                </div>
                                <div className="flex flex-col items-end gap-1 flex-shrink-0">
                                  <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-stone-100 text-stone-600">
                                    {PERIODS.find(p => p.id === t.period)?.label}
                                  </span>
                                  {freqLbl && (
                                    <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-blue-50 text-blue-700">
                                      {freqLbl}
                                    </span>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      );
    }

    function SettingsPanel({ adminPin, onChangePin, onResetDay }) {
      const [oldPin, setOldPin] = useState('');
      const [newPin, setNewPin] = useState('');
      const [confirmPin, setConfirmPin] = useState('');
      const [msg, setMsg] = useState(null);

      const handleChangePin = async () => {
        if (oldPin !== adminPin) { setMsg({ type: 'err', text: 'PIN attuale errato' }); return; }
        if (!/^\d{4}$/.test(newPin)) { setMsg({ type: 'err', text: 'Il nuovo PIN deve essere 4 cifre' }); return; }
        if (newPin !== confirmPin) { setMsg({ type: 'err', text: 'I PIN non coincidono' }); return; }
        const ok = await onChangePin(newPin);
        if (ok) { setMsg({ type: 'ok', text: 'PIN aggiornato' }); setOldPin(''); setNewPin(''); setConfirmPin(''); }
        setTimeout(() => setMsg(null), 3000);
      };

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm p-5">
            <div className="flex items-center gap-2 mb-4">
              <Icon name="key" className="w-4 h-4 text-stone-700" />
              <h3 className="font-semibold tracking-tight">Cambio PIN amministratore</h3>
            </div>
            <div className="space-y-3">
              <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={4} value={oldPin}
                     onChange={e => setOldPin(e.target.value.replace(/\D/g, ''))} placeholder="PIN attuale"
                     className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900" />
              <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={4} value={newPin}
                     onChange={e => setNewPin(e.target.value.replace(/\D/g, ''))} placeholder="Nuovo PIN (4 cifre)"
                     className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900" />
              <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={4} value={confirmPin}
                     onChange={e => setConfirmPin(e.target.value.replace(/\D/g, ''))} placeholder="Conferma nuovo PIN"
                     className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900" />
              {msg && (
                <div className={`text-sm px-3 py-2 rounded-lg flex items-center gap-2 ${msg.type === 'err' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`}>
                  <Icon name="alert" className="w-4 h-4" /> {msg.text}
                </div>
              )}
              <button onClick={handleChangePin} className="w-full py-3 bg-stone-900 text-white rounded-xl font-medium hover:bg-stone-800">Aggiorna PIN</button>
            </div>
          </div>
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm p-5">
            <div className="flex items-center gap-2 mb-2">
              <Icon name="clock" className="w-4 h-4 text-stone-700" />
              <h3 className="font-semibold tracking-tight">Reset giornata corrente</h3>
            </div>
            <p className="text-sm text-stone-500 mb-4">Cancella tutte le mansioni completate di oggi. Lo storico dei giorni precedenti resta intatto.</p>
            <button onClick={() => { if (confirm('Resettare tutte le mansioni di oggi?')) onResetDay(); }}
                    className="w-full py-3 bg-red-50 text-red-600 rounded-xl font-medium hover:bg-red-100">Reset giornata</button>
          </div>
          <div className="bg-stone-100/60 rounded-2xl p-4 text-xs text-stone-500 leading-relaxed">
            <strong className="text-stone-700">Sincronizzazione:</strong> i dati sono condivisi via Firebase in tempo reale. Le modifiche di un dipendente sono visibili a tutti entro 1-2 secondi.
          </div>
        </div>
      );
    }

    // ============== NOTES SCREEN ==============
    function NotesScreen({ user, notes, tab, setTab, onMarkRead, onClose, onReopen, onDelete, onCreate, onExit }) {
      const [showForm, setShowForm] = useState(false);
      const activeNotes = notes.filter(n => !n.closed);
      const closedNotes = notes.filter(n => n.closed);
      const listed = tab === 'active' ? activeNotes : closedNotes;

      return (
        <div className="min-h-screen pb-24">
          <div className="bg-white border-b border-stone-200/60 sticky top-0 z-30 backdrop-blur-xl bg-white/80">
            <div className="max-w-2xl mx-auto px-5 pt-12 pb-3 flex items-center justify-between">
              <button onClick={onExit} className="flex items-center gap-1 text-stone-700 hover:text-stone-900">
                <Icon name="chevronleft" className="w-5 h-5" /> <span className="text-base">Indietro</span>
              </button>
              <div className="flex items-center gap-2">
                <Icon name="bell" className="w-5 h-5 text-stone-700" />
                <div className="text-base font-semibold tracking-tight">Note</div>
              </div>
              <div className="w-16" />
            </div>
            <div className="max-w-2xl mx-auto px-5 pb-3 flex gap-1.5">
              <button onClick={() => setTab('active')}
                      className={`flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium transition-colors ${tab === 'active' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                Attive
                {activeNotes.length > 0 && (
