                  <span className={`t-10 font-bold px-1.5 rounded ${tab === 'active' ? 'bg-white/20' : 'bg-stone-300'}`}>{activeNotes.length}</span>
                )}
              </button>
              <button onClick={() => setTab('closed')}
                      className={`flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium transition-colors ${tab === 'closed' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                <Icon name="archive" className="w-3.5 h-3.5" /> Chiuse
                {closedNotes.length > 0 && (
                  <span className={`t-10 font-bold px-1.5 rounded ${tab === 'closed' ? 'bg-white/20' : 'bg-stone-300'}`}>{closedNotes.length}</span>
                )}
              </button>
            </div>
          </div>

          <div className="max-w-2xl mx-auto px-5 pt-5 space-y-3 animate-scale-in">
            {listed.length === 0 ? (
              <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm p-10 text-center">
                <Icon name={tab === 'active' ? 'bell' : 'archive'} className="w-10 h-10 text-stone-300 mx-auto mb-3" />
                <div className="text-stone-500 text-sm">
                  {tab === 'active' ? 'Nessuna nota attiva' : 'Nessuna nota chiusa'}
                </div>
                {tab === 'active' && (
                  <div className="t-13 text-stone-400 mt-1">Tocca il pulsante in basso per scriverne una</div>
                )}
              </div>
            ) : listed.map(note => (
              <NoteCard
                key={note.id}
                note={note}
                currentUser={user}
                onMarkRead={() => onMarkRead(note.id)}
                onClose={() => onClose(note.id)}
                onReopen={() => onReopen(note.id)}
                onDelete={() => onDelete(note.id)}
              />
            ))}
          </div>

          {/* Floating action button to create a new note */}
          {tab === 'active' && (
            <button onClick={() => setShowForm(true)}
                    className="fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-stone-900 text-white shadow-2xl flex items-center justify-center hover:bg-stone-800 active:scale-95 transition-all">
              <Icon name="plus" className="w-6 h-6" strokeWidth={2.5} />
            </button>
          )}

          {showForm && (
            <NoteFormModal
              onSave={async (data) => { await onCreate(data); setShowForm(false); }}
              onClose={() => setShowForm(false)}
            />
          )}
        </div>
      );
    }

    function NoteCard({ note, currentUser, onMarkRead, onClose, onReopen, onDelete }) {
      const [expanded, setExpanded] = useState(false);
      const readBy = note.readBy || {};
      const isRead = !!readBy[currentUser.id];
      const isAuthor = note.createdById === currentUser.id;
      const readByList = Object.entries(readBy);
      // We can't know unread employees without the global employees list,
      // but we can show the readers count + readers names.

      return (
        <div className={`bg-white rounded-2xl border shadow-sm overflow-hidden ${note.important && !note.closed ? 'border-amber-300 ring-1 ring-amber-200' : 'border-stone-200/60'} ${note.closed ? 'opacity-70' : ''}`}>
          <div className="p-4">
            <div className="flex items-start gap-3">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <div className="w-7 h-7 rounded-full bg-gradient-to-br from-stone-200 to-stone-300 flex items-center justify-center text-stone-700 t-11 font-medium">
                    {note.createdBy.split(' ').map(n => n[0]).slice(0, 2).join('')}
                  </div>
                  <div className="t-13 font-medium text-stone-900">{note.createdBy}</div>
                  <div className="t-11 text-stone-400">·</div>
                  <div className="t-11 text-stone-500">{formatRelativeDate(note.createdAt)}</div>
                  {note.important && !note.closed && (
                    <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-amber-50 text-amber-700">
                      Importante
                    </span>
                  )}
                  {note.closed && (
                    <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-stone-100 text-stone-500">
                      Chiusa
                    </span>
                  )}
                </div>
                <div className="text-[15px] leading-relaxed text-stone-900 whitespace-pre-wrap break-words">{note.text}</div>

                {note.closed && note.closedBy && (
                  <div className="t-11 text-stone-400 mt-2 italic">
                    Chiusa da {note.closedBy} · {formatRelativeDate(note.closedAt)}
                  </div>
                )}
              </div>
            </div>

            {/* Read receipt section */}
            <div className="mt-3 pt-3 border-t border-stone-100">
              <button onClick={() => setExpanded(!expanded)}
                      className="flex items-center justify-between w-full t-11 text-stone-500 hover:text-stone-900">
                <div className="flex items-center gap-1.5">
                  <Icon name="eye" className="w-3.5 h-3.5" />
                  <span>{readByList.length} {readByList.length === 1 ? 'lettura' : 'letture'}</span>
                </div>
                <Icon name={expanded ? 'chevronleft' : 'chevronright'} className={`w-3.5 h-3.5 ${expanded ? 'rotate-90' : ''} transition-transform`} />
              </button>
              {expanded && readByList.length > 0 && (
                <div className="mt-2 space-y-1">
                  {readByList.map(([id, when]) => {
                    const isCurrentUser = id === currentUser.id;
                    return (
                      <div key={id} className="flex items-center justify-between t-11">
                        <span className={isCurrentUser ? 'font-semibold text-stone-900' : 'text-stone-600'}>
                          {isCurrentUser ? `${currentUser.name} (tu)` : id}
                        </span>
                        <span className="text-stone-400">{formatRelativeDate(when)}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Action buttons */}
            <div className="flex gap-2 mt-3">
              {!note.closed && !isRead && (
                <button onClick={onMarkRead}
                        className="flex-1 py-2 bg-stone-900 text-white rounded-xl text-sm font-medium hover:bg-stone-800 flex items-center justify-center gap-1.5">
                  <Icon name="check" className="w-4 h-4" strokeWidth={2.5} /> Segna come letta
                </button>
              )}
              {!note.closed && isRead && (
                <div className="flex-1 py-2 bg-green-50 text-green-700 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5">
                  <Icon name="check" className="w-4 h-4" strokeWidth={2.5} /> Letta
                </div>
              )}
              {!note.closed && isAuthor && (
                <button onClick={() => { if (confirm('Chiudere questa nota?')) onClose(); }}
                        className="px-3 py-2 bg-stone-100 text-stone-700 rounded-xl text-sm font-medium hover:bg-stone-200 flex items-center gap-1.5">
                  <Icon name="archive" className="w-4 h-4" /> Chiudi
                </button>
              )}
              {note.closed && isAuthor && (
                <button onClick={onReopen}
                        className="flex-1 py-2 bg-stone-100 text-stone-700 rounded-xl text-sm font-medium hover:bg-stone-200">
                  Riapri
                </button>
              )}
              {isAuthor && (
                <button onClick={() => { if (confirm('Eliminare questa nota definitivamente?')) onDelete(); }}
                        className="px-3 py-2 rounded-xl text-red-500 hover:bg-red-50">
                  <Icon name="trash" className="w-4 h-4" />
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function NoteFormModal({ onSave, onClose }) {
      const [text, setText] = useState('');
      const [important, setImportant] = useState(false);
      const [saving, setSaving] = useState(false);
      const canSave = text.trim().length > 0 && !saving;

      const handleSubmit = async () => {
        if (!canSave) return;
        setSaving(true);
        await onSave({ text: text.trim(), important });
        setSaving(false);
      };

      return (
        <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-sm p-0 sm:p-6 animate-fade-in">
          <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 animate-scale-in">
            <div className="flex items-center justify-between mb-5">
              <div className="text-lg font-semibold tracking-tight">Nuova nota</div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 hover:bg-stone-200"><Icon name="x" className="w-4 h-4" /></button>
            </div>
            <div className="space-y-4">
              <textarea autoFocus value={text} onChange={e => setText(e.target.value)} rows={5}
                        placeholder="Scrivi una comunicazione per lo staff…"
                        className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:bg-stone-50 focus:ring-2 focus:ring-stone-900 resize-none leading-relaxed" />
              <button onClick={() => setImportant(!important)}
                      className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-colors ${important ? 'bg-amber-50 border border-amber-200' : 'bg-stone-100 border border-transparent'}`}>
                <div className="flex items-center gap-2">
                  <Icon name="alert" className={`w-4 h-4 ${important ? 'text-amber-600' : 'text-stone-500'}`} />
                  <span className={`text-sm font-medium ${important ? 'text-amber-900' : 'text-stone-700'}`}>Segna come importante</span>
                </div>
                <div className={`w-10 h-6 rounded-full p-0.5 transition-colors ${important ? 'bg-amber-500' : 'bg-stone-300'}`}>
                  <div className={`w-5 h-5 rounded-full bg-white transition-transform ${important ? 'translate-x-4' : ''}`} />
                </div>
              </button>
            </div>
            <div className="flex gap-2 mt-6">
              <button onClick={onClose} className="flex-1 py-3 bg-stone-100 text-stone-700 rounded-xl font-medium hover:bg-stone-200">Annulla</button>
              <button onClick={handleSubmit} disabled={!canSave}
                      className="flex-1 py-3 bg-stone-900 text-white rounded-xl font-medium disabled:opacity-30 disabled:cursor-not-allowed hover:bg-stone-800 flex items-center justify-center gap-2">
                <Icon name="send" className="w-4 h-4" /> {saving ? 'Invio…' : 'Pubblica'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============== ORDINI (tabella + archivio) ==============
    // L'ordine in corso vive nella collection `products`: un documento = una riga.
    // Alla chiusura le righe vengono impacchettate in un documento `orders` e cancellate.
    const ORDER_UNITS = ['ct', 'pz', 'bt', 'kg', 'lt'];

    function formatDateShort(key) {
      if (!key) return '';
      const parts = key.split('-');
      if (parts.length !== 3) return key;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    // Testo pronto da incollare in WhatsApp al fornitore
    function buildOrderText(order) {
      const lines = [];
      lines.push(`Ordine ${formatDateShort(order.date)}${order.supplier ? ' — ' + order.supplier : ''}`);
      lines.push('');
      (order.items || []).forEach(i => {
        const qty = (i.qty || '').trim();
        const unit = (i.unit || '').trim();
        // L'unità ha senso solo se c'è una quantità
        const q = qty ? (unit ? `${qty} ${unit}` : qty) : '';
        lines.push(q ? `• ${i.name} — ${q}` : `• ${i.name}`);
      });
      return lines.join('\n');
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) { /* fallback sotto */ }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    function OrdersScreen({ user, products, orders, tab, setTab, onAddRow, onUpdateRow, onDeleteRow, onCloseOrder, onDeleteOrder, onToast, onExit }) {
      const [showClose, setShowClose] = useState(false);
      const [focusId, setFocusId] = useState(null);
      const [adding, setAdding] = useState(false);

      const filled = products.filter(p => (p.name || '').trim().length > 0);

      const handleAdd = async () => {
        if (adding) return;
        setAdding(true);
        try {
          const id = await onAddRow();
          if (id) setFocusId(id);
        } finally {
          setAdding(false);
        }
      };

      return (
        <div className="min-h-screen pb-28">
          {/* ---------- HEADER (resta fisso in alto) ---------- */}
          <div className="bg-white border-b border-stone-200/60 sticky top-0 z-30 backdrop-blur-xl bg-white/90">
            <div className="max-w-2xl mx-auto px-5 pt-12 pb-3 flex items-center justify-between">
              <button onClick={onExit} className="flex items-center gap-1 text-stone-700 hover:text-stone-900">
                <Icon name="chevronleft" className="w-5 h-5" /> <span className="text-base">Indietro</span>
              </button>
              <div className="flex items-center gap-2">
                <Icon name="cart" className="w-5 h-5 text-stone-700" />
                <div className="text-base font-semibold tracking-tight">Ordini</div>
              </div>
              <div className="w-16" />
            </div>

            <div className="max-w-2xl mx-auto px-5 pb-3 flex gap-1.5">
              <button onClick={() => setTab('current')}
                      className={`flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium transition-colors ${tab === 'current' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                Ordine in corso
                {filled.length > 0 && (
                  <span className={`t-10 font-bold px-1.5 rounded ${tab === 'current' ? 'bg-white/20' : 'bg-stone-300'}`}>{filled.length}</span>
                )}
              </button>
              <button onClick={() => setTab('archive')}
                      className={`flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-medium transition-colors ${tab === 'archive' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-700'}`}>
                <Icon name="archive" className="w-3.5 h-3.5" /> Archivio
                {orders.length > 0 && (
                  <span className={`t-10 font-bold px-1.5 rounded ${tab === 'archive' ? 'bg-white/20' : 'bg-stone-300'}`}>{orders.length}</span>
                )}
              </button>
            </div>

            {/* Intestazione della tabella: sticky insieme all'header */}
            {tab === 'current' && products.length > 0 && (
              <div className="max-w-2xl mx-auto px-5">
                <div className="grid grid-cols-[1fr_74px_54px_28px] gap-1 border-t border-stone-200/70 py-2">
                  <div className="t-10 uppercase tracking-widest text-stone-400 font-semibold pl-2">Prodotto</div>
                  <div className="t-10 uppercase tracking-widest text-stone-400 font-semibold text-center">Q.tà</div>
                  <div className="t-10 uppercase tracking-widest text-stone-400 font-semibold text-center">Un.</div>
                  <div />
                </div>
              </div>
            )}
          </div>

          {/* ---------- ORDINE IN CORSO ---------- */}
          {tab === 'current' && (
            <div className="max-w-2xl mx-auto px-5 pt-3 animate-scale-in">
              <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
                {products.length === 0 ? (
                  <div className="p-10 text-center">
                    <Icon name="cart" className="w-10 h-10 text-stone-300 mx-auto mb-3" />
                    <div className="text-stone-500 text-sm">Nessun prodotto in lista</div>
                    <div className="t-13 text-stone-400 mt-1">Tocca «Aggiungi riga» per iniziare</div>
                  </div>
                ) : products.map(p => (
                  <OrderRow
                    key={p.id}
                    product={p}
                    autoFocus={focusId === p.id}
                    onFocused={() => setFocusId(null)}
                    onUpdate={(patch) => onUpdateRow(p.id, patch)}
                    onDelete={() => onDeleteRow(p.id)}
                    onEnter={handleAdd}
                  />
                ))}

                <button onClick={handleAdd} disabled={adding}
                        className="w-full flex items-center justify-center gap-2 py-3.5 text-stone-600 hover:bg-stone-50 active:bg-stone-100 border-t border-stone-100 text-sm font-medium disabled:opacity-40">
                  <Icon name="plus" className="w-4 h-4" strokeWidth={2.5} /> Aggiungi riga
                </button>
              </div>

              <button onClick={() => setShowClose(true)} disabled={filled.length === 0}
                      className="w-full mt-4 py-3.5 rounded-2xl bg-stone-900 text-white font-medium hover:bg-stone-800 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                <Icon name="archive" className="w-4 h-4" /> Chiudi ordine
              </button>
              <div className="t-11 text-stone-400 text-center mt-2">
                Archivia l’ordine e svuota la tabella
              </div>
            </div>
          )}

          {/* ---------- ARCHIVIO ---------- */}
          {tab === 'archive' && (
            <div className="max-w-2xl mx-auto px-5 pt-5 space-y-3 animate-scale-in">
              {orders.length === 0 ? (
                <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm p-10 text-center">
                  <Icon name="archive" className="w-10 h-10 text-stone-300 mx-auto mb-3" />
                  <div className="text-stone-500 text-sm">Nessun ordine archiviato</div>
                  <div className="t-13 text-stone-400 mt-1">Gli ordini chiusi compaiono qui</div>
                </div>
              ) : orders.map(o => (
                <ArchivedOrderCard key={o.id} order={o} onDelete={() => onDeleteOrder(o.id)} onToast={onToast} />
              ))}
            </div>
          )}

          {showClose && (
            <CloseOrderModal
              count={filled.length}
              onConfirm={async (data) => {
                const ok = await onCloseOrder(data);
                if (ok) { setShowClose(false); setTab('archive'); }
              }}
              onClose={() => setShowClose(false)}
            />
          )}
        </div>
      );
    }

    // Una riga della tabella. Le celle si scrivono direttamente e salvano all'uscita
    // dal campo. La sincronizzazione live non sovrascrive la cella che stai scrivendo.
    function OrderRow({ product, autoFocus, onFocused, onUpdate, onDelete, onEnter }) {
      const [name, setName] = useState(product.name || '');
      const [qty, setQty] = useState(product.qty || '');
      const focusedRef = useRef(null);
      const nameRef = useRef(null);

      useEffect(() => {
        if (focusedRef.current !== 'name') setName(product.name || '');
      }, [product.name]);

      useEffect(() => {
        if (focusedRef.current !== 'qty') setQty(product.qty || '');
      }, [product.qty]);

      useEffect(() => {
        if (autoFocus && nameRef.current) {
          nameRef.current.focus();
          onFocused();
        }
      }, [autoFocus]);

      const commit = (field, value) => {
        focusedRef.current = null;
        if ((product[field] || '') === value) return;
        const patch = {};
        patch[field] = value;
        onUpdate(patch);
      };

      const cellBase = 'w-full bg-transparent outline-none py-3 rounded-lg focus:bg-stone-50';

      return (
        <div className="grid grid-cols-[1fr_74px_54px_28px] gap-1 items-center border-b border-stone-100 last:border-b-0 px-5">
          <input
            ref={nameRef}
            value={name}
            onChange={e => setName(e.target.value)}
            onFocus={() => { focusedRef.current = 'name'; }}
            onBlur={() => commit('name', name.trim())}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); onEnter(); } }}
            placeholder="Nome prodotto"
            className={`${cellBase} px-2 t-15 font-medium text-stone-900 placeholder:text-stone-300 placeholder:font-normal`}
          />
          <input
            value={qty}
            onChange={e => setQty(e.target.value)}
            onFocus={() => { focusedRef.current = 'qty'; }}
            onBlur={() => commit('qty', qty.trim())}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }}
            inputMode="decimal"
            placeholder="—"
            title={qty}
            className={`${cellBase} px-1 t-15 text-center text-stone-700 placeholder:text-stone-300`}
          />
          <select
            value={product.unit || 'ct'}
            onChange={e => onUpdate({ unit: e.target.value })}
            className={`${cellBase} px-1 t-13 text-center text-stone-600 appearance-none cursor-pointer`}
          >
            {ORDER_UNITS.map(u => <option key={u} value={u}>{u}</option>)}
          </select>
          <button onClick={onDelete} title="Elimina riga"
                  className="w-7 h-7 rounded-full flex items-center justify-center text-stone-300 hover:text-red-500 hover:bg-red-50 justify-self-end">
            <Icon name="x" className="w-3.5 h-3.5" strokeWidth={2.5} />
          </button>
        </div>
      );
    }

    function ArchivedOrderCard({ order, onDelete, onToast }) {
      const [open, setOpen] = useState(false);
      const items = order.items || [];

      const handleCopy = async () => {
        const ok = await copyToClipboard(buildOrderText(order));
        onToast(ok ? 'Lista copiata negli appunti' : 'Copia non riuscita');
      };

      return (
        <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
          <button onClick={() => setOpen(!open)} className="w-full p-4 flex items-center gap-3 text-left hover:bg-stone-50">
            <div className="w-9 h-9 rounded-xl bg-stone-100 flex items-center justify-center flex-shrink-0">
              <Icon name="archive" className="w-4 h-4 text-stone-500" />
            </div>
            <div className="flex-1 min-w-0">
              <div className="t-15 font-semibold text-stone-900">{formatDateShort(order.date)}</div>
              <div className="t-11 text-stone-400 mt-0.5 truncate">
                {items.length} {items.length === 1 ? 'prodotto' : 'prodotti'}
                {order.supplier ? ` · ${order.supplier}` : ''}
                {order.closedBy ? ` · ${order.closedBy}` : ''}
              </div>
            </div>
            <Icon name="chevronright" className={`w-4 h-4 text-stone-300 flex-shrink-0 transition-transform ${open ? 'rotate-90' : ''}`} />
          </button>

          {open && (
            <div className="border-t border-stone-100">
              <div className="grid grid-cols-[1fr_74px_54px] gap-1 px-4 pt-3 pb-1">
                <div className="t-10 uppercase tracking-widest text-stone-400 font-semibold">Prodotto</div>
                <div className="t-10 uppercase tracking-widest text-stone-400 font-semibold text-center">Q.tà</div>
                <div className="t-10 uppercase tracking-widest text-stone-400 font-semibold text-center">Un.</div>
              </div>
              {items.map((i, k) => (
                <div key={k} className="grid grid-cols-[1fr_74px_54px] gap-1 px-4 py-2 border-t border-stone-50">
                  <div className="t-13 text-stone-900 break-words">{i.name}</div>
                  <div className="t-13 text-stone-600 text-center">{i.qty || '—'}</div>
                  <div className="t-13 text-stone-500 text-center">{i.unit || ''}</div>
                </div>
              ))}
              <div className="flex gap-2 p-4 pt-3">
                <button onClick={handleCopy}
                        className="flex-1 py-2.5 bg-stone-900 text-white rounded-xl text-sm font-medium hover:bg-stone-800 flex items-center justify-center gap-1.5">
                  <Icon name="copy" className="w-4 h-4" /> Copia lista
                </button>
                <button onClick={() => { if (confirm("Eliminare questo ordine dall'archivio?")) onDelete(); }}
                        className="px-3 py-2.5 rounded-xl text-red-500 hover:bg-red-50">
                  <Icon name="trash" className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function CloseOrderModal({ count, onConfirm, onClose }) {
      const [date, setDate] = useState(todayKey());
      const [supplier, setSupplier] = useState('');
      const [saving, setSaving] = useState(false);

      const handleSubmit = async () => {
        if (saving) return;
        setSaving(true);
        try {
          await onConfirm({ date, supplier });
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-sm p-0 sm:p-6 animate-fade-in">
          <div className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 animate-scale-in max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-5">
              <div className="text-lg font-semibold tracking-tight">Chiudi ordine</div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 hover:bg-stone-200"><Icon name="x" className="w-4 h-4" /></button>
            </div>
            <div className="space-y-4">
              <Field label="Data ordine">
                <input type="date" value={date} onChange={e => setDate(e.target.value)}
                       className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:bg-stone-50 focus:ring-2 focus:ring-stone-900" />
              </Field>
              <Field label="Fornitore (facoltativo)">
                <input value={supplier} onChange={e => setSupplier(e.target.value)} placeholder="Es. Metro, Partesa…"
                       className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:bg-stone-50 focus:ring-2 focus:ring-stone-900" />
              </Field>
              <div className="t-13 text-stone-500 bg-stone-50 rounded-xl px-4 py-3">
                {count} {count === 1 ? 'prodotto verrà archiviato' : 'prodotti verranno archiviati'}. La tabella dell’ordine in corso verrà svuotata.
              </div>
            </div>
            <div className="flex gap-2 mt-6">
              <button onClick={onClose} className="flex-1 py-3 bg-stone-100 text-stone-700 rounded-xl font-medium hover:bg-stone-200">Annulla</button>
              <button onClick={handleSubmit} disabled={saving}
                      className="flex-1 py-3 bg-stone-900 text-white rounded-xl font-medium disabled:opacity-30 disabled:cursor-not-allowed hover:bg-stone-800 flex items-center justify-center gap-2">
                <Icon name="archive" className="w-4 h-4" /> {saving ? 'Archiviazione…' : 'Archivia'}
              </button>
            </div>
          </div>
        </div>
      );
    }


    // Helper: relative date formatter (uses existing formatTime / formatDateLong)
    function formatRelativeDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const diffMs = now - d;
      const diffMin = Math.round(diffMs / 60000);
      if (diffMin < 1) return 'ora';
      if (diffMin < 60) return `${diffMin} min fa`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return `${diffH}h fa`;
      const sameDay = d.toDateString() === now.toDateString();
      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      const isYesterday = d.toDateString() === yesterday.toDateString();
      if (sameDay) return `oggi ${formatTime(iso)}`;
      if (isYesterday) return `ieri ${formatTime(iso)}`;
      return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) + ' ' + formatTime(iso);
    }

    function FilterChip({ label, active, onClick }) {
      return <button onClick={onClick} className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${active ? 'bg-stone-900 text-white' : 'bg-white border border-stone-200/60 text-stone-700'}`}>{label}</button>;
    }

    function Field({ label, children }) {
      return (
        <div>
          <div className="t-11 uppercase tracking-widest text-stone-500 font-medium mb-1.5">{label}</div>
          {children}
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
