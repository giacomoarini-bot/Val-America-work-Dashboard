<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1d1d1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hotel Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏨</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body { background: #f5f5f7; -webkit-font-smoothing: antialiased; font-family: -apple-system, BlinkMacFontSystem, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; }
    .t-10 { font-size: 10px; line-height: 1.4; }
    .t-11 { font-size: 11px; line-height: 1.4; }
    .t-13 { font-size: 13px; line-height: 1.45; }
    .t-15 { font-size: 15px; line-height: 1.4; }
    @keyframes fade-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    @keyframes scale-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    .animate-scale-in { animation: scale-in 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 0.8s linear infinite; }
    /* Disable iOS double-tap zoom on buttons */
    button { touch-action: manipulation; }
    /* Hide scrollbars on horizontal chip rows */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase SDK (modular, via CDN) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import {
      getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot,
      collection, getDocs, deleteField
    } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

    // ============================================================
    // CONFIGURAZIONE FIREBASE — INCOLLA QUI I TUOI VALORI
    // (li trovi nella console Firebase, vedi README)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyC5hYgkM1JNwerc58ozk-IrXQmYa0A_Ek8",
      authDomain: "ciao-bella-dashboard.firebaseapp.com",
      projectId: "ciao-bella-dashboard",
      storageBucket: "ciao-bella-dashboard.firebasestorage.app",
      messagingSenderId: "724229253497",
      appId: "1:724229253497:web:2c3fde8bdc72d46b7767a8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Detect if config still contains placeholders (compare values, not source code)
    window.fbConfigValid = !Object.values(firebaseConfig).some(v =>
      typeof v === 'string' && v.startsWith('PASTE_YOUR_')
    );

    // Expose Firestore helpers to React app
    window.fb = {
      getDoc: (path) => getDoc(doc(db, ...path.split('/'))),
      setDoc: (path, data, opts = { merge: true }) => setDoc(doc(db, ...path.split('/')), data, opts),
      deleteDoc: (path) => deleteDoc(doc(db, ...path.split('/'))),
      onSnapshot: (path, cb) => onSnapshot(doc(db, ...path.split('/')), cb),
      onSnapshotCollection: (path, cb) => onSnapshot(collection(db, ...path.split('/')), cb),
      getCollection: (path) => getDocs(collection(db, ...path.split('/'))),
      deleteField: () => deleteField()
    };
    window.fbReady = true;
    window.dispatchEvent(new Event('fbready'));
  </script>

  <!-- React App -->
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useCallback, useRef } = React;

    // ============== CONSTANTS ==============
    const AREAS = [
      { id: 'sala', label: 'Sala', color: '#FF9500' },
      { id: 'bar', label: 'Bar', color: '#AF52DE' },
      { id: 'check', label: 'Check', color: '#34C759' }
    ];
    const PERIODS = [
      { id: 'mattina', label: 'Mattina', hours: [5, 12] },
      { id: 'pomeriggio', label: 'Pomeriggio', hours: [13, 17] },
      { id: 'sera', label: 'Sera', hours: [18, 4] }
    ];
    const DEFAULT_PIN = '0000';

    const DEFAULT_EMPLOYEES = [
      { id: 'emp_1', name: 'Mario Rossi' },
      { id: 'emp_2', name: 'Giulia Bianchi' },
      { id: 'emp_3', name: 'Luca Verdi' }
    ];

    const DEFAULT_TASKS = [
      { id: 't1', area: 'sala', period: 'mattina', title: 'Apertura sala colazioni', desc: 'Accendi luci, controlla temperatura, apri tende' },
      { id: 't2', area: 'sala', period: 'mattina', title: 'Mise en place colazione', desc: 'Prepara buffet, posate, tovaglioli' },
      { id: 't3', area: 'bar', period: 'mattina', title: 'Avvio macchina caffè', desc: 'Accendi macchina, calibra macinatura, prepara latte' },
      { id: 't4', area: 'bar', period: 'mattina', title: 'Riassortimento bevande', desc: 'Controlla frigo, riempi vetrina pasticceria' },
      { id: 't5', area: 'check', period: 'mattina', title: 'Controllo HACCP temperature', desc: 'Registra temperature frigo, freezer, vetrina' },
      { id: 't6', area: 'check', period: 'mattina', title: 'Verifica pulizie notturne', desc: 'Sala, bagni, pavimenti' },
      { id: 't7', area: 'sala', period: 'pomeriggio', title: 'Riordino post pranzo', desc: 'Sparecchia, pulisci tavoli, riordina' },
      { id: 't8', area: 'sala', period: 'pomeriggio', title: 'Pulizia profonda pavimenti', desc: '' },
      { id: 't9', area: 'bar', period: 'pomeriggio', title: 'Pulizia banco bar', desc: 'Acciaio, gruppi, vaschetta' },
      { id: 't10', area: 'bar', period: 'pomeriggio', title: 'Inventario rapido bottiglie', desc: 'Segnala mancanze al responsabile' },
      { id: 't11', area: 'check', period: 'pomeriggio', title: 'Controllo bagni pubblici', desc: 'Pulizia + riassortimento' },
      { id: 't12', area: 'sala', period: 'sera', title: 'Mise en place cena', desc: 'Apparecchia tavoli, controlla menù' },
      { id: 't13', area: 'sala', period: 'sera', title: 'Briefing turno sera', desc: 'Allergeni, prenotazioni, fuori menù' },
      { id: 't14', area: 'bar', period: 'sera', title: 'Setup cocktail station', desc: 'Ghiaccio, garnish, strumenti' },
      { id: 't15', area: 'bar', period: 'sera', title: 'Preparazione mise en place miscelazione', desc: 'Sciroppi, succhi freschi, fruit' },
      { id: 't16', area: 'check', period: 'sera', title: 'Chiusura HACCP', desc: 'Registra temperature serali, sanificazioni' },
      { id: 't17', area: 'check', period: 'sera', title: 'Chiusura cassa e accessi', desc: 'Conteggio, riepilogo, allarme' }
    ];

    // ============== HELPERS ==============
    const todayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const detectPeriod = () => {
      const h = new Date().getHours();
      if (h >= 5 && h < 13) return 'mattina';
      if (h >= 13 && h < 18) return 'pomeriggio';
      return 'sera';
    };
    const formatTime = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    };
    const formatDateLong = (key) => {
      const [y, m, d] = key.split('-');
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    };
    const greeting = () => {
      const h = new Date().getHours();
      if (h < 12) return 'Buongiorno';
      if (h < 18) return 'Buon pomeriggio';
      return 'Buonasera';
    };

    // Local-only persistence (per device — keeps logged-in employee)
    const localGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
    const localSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
    const localDel = (k) => { try { localStorage.removeItem(k); } catch {} };

    // ============== ICONS (inline SVG, no external dep) ==============
    const Icon = ({ name, className = "w-4 h-4", strokeWidth = 2 }) => {
      const paths = {
        lock: "M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4",
        plus: "M12 5v14M5 12h14",
        x: "M18 6 6 18M6 6l12 12",
        check: "M20 6 9 17l-5-5",
        settings: "M12 1v6m0 6v6m11-7h-6m-6 0H1m20.49-7.49-4.24 4.24M6.34 17.66l-4.24 4.24m0-20 4.24 4.24m11.32 11.32 4.24 4.24M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z",
        chevronright: "m9 18 6-6-6-6",
        chevronleft: "m15 18-6-6 6-6",
        sun: "M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42",
        cloud: "M17.5 19a4.5 4.5 0 1 0 0-9h-1.8a7 7 0 1 0-13.7 2",
        moon: "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z",
        coffee: "M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3",
        utensils: "M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7",
        clipboard: "M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11",
        trash: "M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
        edit: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
        history: "M3 3v5h5M3.05 13A9 9 0 1 0 6 5.3L3 8M12 7v5l4 2",
        users: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
        list: "M3 6h18M3 12h18M3 18h18",
        key: "M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3M11.4 11.4a4 4 0 1 1-5.65 5.65l-3.75 3.75 2.83 2.83 3.75-3.75a4 4 0 0 1 5.65-5.65z",
        logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
        shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
        clock: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2",
        alert: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 8v4M12 16h.01",
        refresh: "M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d={paths[name]} />
        </svg>
      );
    };

    // ============== APP ==============
    function App() {
      const [fbReady, setFbReady] = useState(!!window.fbReady);
      const [screen, setScreen] = useState('loading');
      const [currentUser, setCurrentUser] = useState(null);
      const [employees, setEmployees] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [dayState, setDayState] = useState({});
      const [adminPin, setAdminPinValue] = useState(DEFAULT_PIN);
      const [activePeriod, setActivePeriod] = useState(detectPeriod());
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);
      const [adminTab, setAdminTab] = useState('tasks');
      const [toast, setToast] = useState(null);
      const [connectionError, setConnectionError] = useState(null);

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2400);
      }, []);

      // Wait for Firebase to load
      useEffect(() => {
        if (window.fbReady) { setFbReady(true); return; }
        const handler = () => setFbReady(true);
        window.addEventListener('fbready', handler);
        return () => window.removeEventListener('fbready', handler);
      }, []);

      // Initial seed + load
      useEffect(() => {
        if (!fbReady) return;
        (async () => {
          try {
            // Check if config is filled
            if (firebaseConfigPlaceholder()) {
              setConnectionError('config');
              return;
            }

            // Seed config doc if missing
            const configRef = 'app/config';
            const configSnap = await window.fb.getDoc(configRef);
            if (!configSnap.exists()) {
              await window.fb.setDoc(configRef, {
                pin: DEFAULT_PIN,
                employees: DEFAULT_EMPLOYEES,
                tasks: DEFAULT_TASKS,
                createdAt: new Date().toISOString()
              }, { merge: false });
            }

            // Live subscribe to config
            window.fb.onSnapshot(configRef, (snap) => {
              const data = snap.data();
              if (data) {
                setEmployees(data.employees || []);
                setTasks(data.tasks || []);
                setAdminPinValue(data.pin || DEFAULT_PIN);
              }
            });

            // Live subscribe to today's state
            window.fb.onSnapshot(`days/${todayKey()}`, (snap) => {
              const data = snap.exists() ? snap.data() : {};
              setDayState(data || {});
            });

            // Restore logged-in employee
            const localUser = localGet('hotel:current_user');
            if (localUser) {
              setCurrentUser(localUser);
              setScreen('dashboard');
            } else {
              setScreen('login');
            }
          } catch (err) {
            console.error('Firebase error:', err);
            setConnectionError(err.code || err.message || 'unknown');
          }
        })();
      }, [fbReady]);

      // Auto-update period every minute
      useEffect(() => {
        const id = setInterval(() => setActivePeriod(detectPeriod()), 60000);
        return () => clearInterval(id);
      }, []);

      // ============== HANDLERS ==============
      const handleLogin = (employee) => {
        setCurrentUser(employee);
        localSet('hotel:current_user', employee);
        setScreen('dashboard');
      };

      const handleLogout = () => {
        setScreen('login');
        setCurrentUser(null);
        localDel('hotel:current_user');
      };

      // Toggle a single task — uses Firestore field-level update.
      // No race condition: each task is its own field, writes don't interfere.
      const handleToggleTask = async (taskId) => {
        if (!currentUser) return;
        const path = `days/${todayKey()}`;
        const isDone = dayState[taskId]?.done;

        try {
          if (isDone) {
            await window.fb.setDoc(path, { [taskId]: window.fb.deleteField() }, { merge: true });
          } else {
            await window.fb.setDoc(path, {
              [taskId]: {
                done: true,
                doneBy: currentUser.name,
                doneById: currentUser.id,
                doneAt: new Date().toISOString()
              }
            }, { merge: true });
          }
        } catch (err) {
          console.error('Toggle failed:', err);
          showToast('Errore di rete. Riprova.');
        }
      };

      const handleEnterAdmin = () => {
        setPinInput('');
        setPinError(false);
        setScreen('admin-pin');
      };

      const handlePinSubmit = () => {
        if (pinInput === adminPin) {
          setPinInput('');
          setPinError(false);
          setScreen('admin');
        } else {
          setPinError(true);
          setTimeout(() => setPinError(false), 600);
          setPinInput('');
        }
      };

      // Admin: employees
      const addEmployee = async (name) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        const newEmp = { id: `emp_${Date.now()}`, name: trimmed };
        const updated = [...employees, newEmp];
        await window.fb.setDoc('app/config', { employees: updated }, { merge: true });
        showToast('Dipendente aggiunto');
      };

      const removeEmployee = async (id) => {
        const updated = employees.filter(e => e.id !== id);
        await window.fb.setDoc('app/config', { employees: updated }, { merge: true });
        showToast('Dipendente rimosso');
      };

      // Admin: tasks
      const addTask = async (taskData) => {
        const newTask = { id: `t_${Date.now()}`, ...taskData };
        const updated = [...tasks, newTask];
        await window.fb.setDoc('app/config', { tasks: updated }, { merge: true });
        showToast('Mansione aggiunta');
      };

      const updateTask = async (id, taskData) => {
        const updated = tasks.map(t => t.id === id ? { ...t, ...taskData } : t);
        await window.fb.setDoc('app/config', { tasks: updated }, { merge: true });
        showToast('Mansione aggiornata');
      };

      const removeTask = async (id) => {
        const updated = tasks.filter(t => t.id !== id);
        await window.fb.setDoc('app/config', { tasks: updated }, { merge: true });
        showToast('Mansione rimossa');
      };

      const changePin = async (newPin) => {
        if (!/^\d{4}$/.test(newPin)) return false;
        await window.fb.setDoc('app/config', { pin: newPin }, { merge: true });
        showToast('PIN aggiornato');
        return true;
      };

      const resetDay = async () => {
        await window.fb.setDoc(`days/${todayKey()}`, {}, { merge: false });
        showToast('Giornata resettata');
      };

      // ============== RENDER ==============
      if (connectionError === 'config') {
        return <ConfigErrorScreen />;
      }
      if (connectionError) {
        return <FirebaseErrorScreen error={connectionError} />;
      }
      if (!fbReady || screen === 'loading') {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-stone-400 text-sm tracking-wide">Caricamento…</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen text-stone-900 antialiased">
          {screen === 'login' && (
            <LoginScreen employees={employees} onLogin={handleLogin} onAdmin={handleEnterAdmin} />
          )}
          {screen === 'dashboard' && currentUser && (
            <Dashboard
              user={currentUser}
              tasks={tasks}
              dayState={dayState}
              activePeriod={activePeriod}
              setActivePeriod={setActivePeriod}
              onToggle={handleToggleTask}
              onLogout={handleLogout}
              onAdmin={handleEnterAdmin}
            />
          )}
          {screen === 'admin-pin' && (
            <PinScreen
              pin={pinInput}
              setPin={setPinInput}
              error={pinError}
              onSubmit={handlePinSubmit}
              onCancel={() => setScreen(currentUser ? 'dashboard' : 'login')}
            />
          )}
          {screen === 'admin' && (
            <AdminPanel
              tab={adminTab}
              setTab={setAdminTab}
              employees={employees}
              tasks={tasks}
              dayState={dayState}
              adminPin={adminPin}
              onAddEmployee={addEmployee}
              onRemoveEmployee={removeEmployee}
              onAddTask={addTask}
              onUpdateTask={updateTask}
              onRemoveTask={removeTask}
              onChangePin={changePin}
              onResetDay={resetDay}
              onExit={() => setScreen(currentUser ? 'dashboard' : 'login')}
            />
          )}
          {toast && (
            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 animate-fade-in">
              <div className="bg-stone-900/90 backdrop-blur-xl text-white text-sm px-5 py-3 rounded-2xl shadow-2xl">{toast}</div>
            </div>
          )}
        </div>
      );
    }

    function firebaseConfigPlaceholder() {
      // Read flag set by the module that initialized firebaseConfig
      return window.fbConfigValid === false;
    }

    function ConfigErrorScreen() {
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-md bg-white rounded-3xl border border-stone-200/60 shadow-sm p-8 animate-scale-in">
            <div className="w-12 h-12 rounded-2xl bg-amber-100 flex items-center justify-center mb-4">
              <Icon name="alert" className="w-6 h-6 text-amber-600" />
            </div>
            <h1 className="text-xl font-semibold tracking-tight mb-2">Configurazione Firebase mancante</h1>
            <p className="text-sm text-stone-600 leading-relaxed mb-3">
              Apri <code className="bg-stone-100 px-1.5 py-0.5 rounded text-xs">index.html</code> e sostituisci
              i valori <code className="bg-stone-100 px-1.5 py-0.5 rounded text-xs">PASTE_YOUR_*</code> con
              quelli del tuo progetto Firebase.
            </p>
            <p className="text-sm text-stone-600 leading-relaxed">
              Vedi il <strong>README.md</strong> della repo per la guida passo-passo.
            </p>
          </div>
        </div>
      );
    }

    function FirebaseErrorScreen({ error }) {
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-md bg-white rounded-3xl border border-stone-200/60 shadow-sm p-8">
            <div className="w-12 h-12 rounded-2xl bg-red-100 flex items-center justify-center mb-4">
              <Icon name="alert" className="w-6 h-6 text-red-600" />
            </div>
            <h1 className="text-xl font-semibold tracking-tight mb-2">Errore di connessione</h1>
            <p className="text-sm text-stone-600 leading-relaxed mb-2">
              Impossibile connettersi a Firebase. Possibili cause:
            </p>
            <ul className="text-sm text-stone-600 space-y-1 mb-3 list-disc pl-5">
              <li>Connessione internet assente</li>
              <li>Regole Firestore troppo restrittive (vedi README)</li>
              <li>Configurazione errata in index.html</li>
            </ul>
            <code className="block bg-stone-100 p-3 rounded-lg text-xs text-stone-700 break-all">{error}</code>
          </div>
        </div>
      );
    }

    // ============== PIN SCREEN ==============
    function PinScreen({ pin, setPin, error, onSubmit, onCancel }) {
      useEffect(() => {
        if (pin.length === 4) { const t = setTimeout(onSubmit, 150); return () => clearTimeout(t); }
      }, [pin, onSubmit]);
      const handleKey = (k) => {
        if (k === 'del') setPin(pin.slice(0, -1));
        else if (pin.length < 4) setPin(pin + k);
      };
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6">
          <div className="w-full max-w-xs animate-scale-in">
            <button onClick={onCancel} className="mb-8 flex items-center gap-1 text-stone-500 hover:text-stone-900 text-sm">
              <Icon name="chevronleft" className="w-4 h-4" /> Indietro
            </button>
            <div className="text-center mb-10">
              <div className="w-14 h-14 rounded-2xl bg-stone-900 flex items-center justify-center mx-auto mb-5">
                <Icon name="lock" className="w-6 h-6 text-white" />
              </div>
              <h2 className="text-2xl font-semibold tracking-tight">Inserisci PIN</h2>
              <p className="text-stone-500 text-sm mt-1">Accesso amministratore</p>
            </div>
            <div className={`flex justify-center gap-3 mb-12 ${error ? 'animate-shake' : ''}`}>
              {[0, 1, 2, 3].map(i => (
                <div key={i} className="w-4 h-4 rounded-full transition-all"
                     style={{ backgroundColor: error ? '#FF3B30' : (i < pin.length ? '#1d1d1f' : 'transparent'),
                              border: i < pin.length || error ? 'none' : '2px solid #d6d3d1' }} />
              ))}
            </div>
            <div className="grid grid-cols-3 gap-3">
              {keys.map((k, i) => (
                k === '' ? <div key={i} /> : (
                  <button key={i} onClick={() => handleKey(k)}
                          className="aspect-square rounded-2xl bg-white hover:bg-stone-100 active:bg-stone-200 transition-colors text-2xl font-light text-stone-900 shadow-sm border border-stone-200/60 flex items-center justify-center">
                    {k === 'del' ? <Icon name="chevronleft" className="w-6 h-6" /> : k}
                  </button>
                )
              ))}
            </div>
          </div>
        </div>
      );
    }

            <div className="flex items-center justify-between mb-6">

                  {user.name.split(' ').map(n => n[0]).slice(0, 2).join('')}
                </div>
                <div className="text-left">
                  <div className="t-11 text-stone-500 uppercase tracking-wider leading-none">Operatore</div>
                  <div className="text-sm font-medium text-stone-900 leading-tight">{user.name}</div>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={onAdmin} className="w-9 h-9 rounded-full bg-white shadow-sm border border-stone-200/60 flex items-center justify-center hover:bg-stone-50 transition-colors" title="Admin">
                  <Icon name="settings" className="w-4 h-4 text-stone-600" />
                </button>
                <button onClick={onLogout} className="w-9 h-9 rounded-full bg-white shadow-sm border border-stone-200/60 flex items-center justify-center hover:bg-stone-50 transition-colors" title="Esci">
                  <Icon name="logout" className="w-4 h-4 text-stone-600" />
                </button>
              </div>
            </div>
            <div className="mb-2">
              <div className="t-11 uppercase tracking-widest text-stone-500 font-medium">{formatDateLong(todayKey())}</div>
              <h1 className="text-3xl font-semibold tracking-tight mt-1">
                {greeting()}, <span className="text-stone-500">{user.name.split(' ')[0]}</span>
              </h1>
              <div className="t-11 text-stone-400 mt-1.5 flex items-center gap-1">
                <span className="inline-block w-1.5 h-1.5 rounded-full bg-green-500"></span>
                Sincronizzato in tempo reale
              </div>
            </div>
            <div className="mt-5 bg-white rounded-2xl p-4 border border-stone-200/60 shadow-sm">
              <div className="flex items-center justify-between mb-2.5">

          <div className="px-5 max-w-2xl mx-auto mb-6">

    function TasksManager({ tasks, onAddTask, onUpdateTask, onRemoveTask }) {

      const [filterPeriod, setFilterPeriod] = useState('all');
      const [filterArea, setFilterArea] = useState('all');
      const filtered = tasks.filter(t => (filterPeriod === 'all' || t.period === filterPeriod) && (filterArea === 'all' || t.area === filterArea));
      return (
        <div>
          <div className="flex gap-2 mb-4 overflow-x-auto pb-1 no-scrollbar">
            <FilterChip label="Tutti i turni" active={filterPeriod === 'all'} onClick={() => setFilterPeriod('all')} />
            {PERIODS.map(p => <FilterChip key={p.id} label={p.label} active={filterPeriod === p.id} onClick={() => setFilterPeriod(p.id)} />)}
          </div>
          <div className="flex gap-2 mb-5 overflow-x-auto pb-1 no-scrollbar">
            <FilterChip label="Tutte le aree" active={filterArea === 'all'} onClick={() => setFilterArea('all')} />
            {AREAS.map(a => <FilterChip key={a.id} label={a.label} active={filterArea === a.id} onClick={() => setFilterArea(a.id)} />)}
          </div>
          <button onClick={() => { setEditing(null); setShowForm(true); }}
                  className="w-full mb-4 py-3 bg-stone-900 text-white rounded-2xl font-medium flex items-center justify-center gap-2 hover:bg-stone-800 transition-colors">
            <Icon name="plus" className="w-4 h-4" /> Nuova mansione
          </button>
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
            {filtered.length === 0 ? (
              <div className="p-8 text-center text-stone-400 text-sm">Nessuna mansione</div>
            ) : filtered.map((t, i) => {
              const area = AREAS.find(a => a.id === t.area);
              const period = PERIODS.find(p => p.id === t.period);
              return (
                <div key={t.id} className="px-4 py-3 flex items-start gap-3" style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                  <div className="flex-1 min-w-0">
                    <div className="font-medium t-15 text-stone-900 leading-snug">{t.title}</div>
                    {t.desc && <div className="t-13 text-stone-500 mt-0.5">{t.desc}</div>}
                    <div className="flex gap-1.5 mt-2">
                      <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md" style={{ backgroundColor: `${area?.color}15`, color: area?.color }}>{area?.label}</span>
                      <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-stone-100 text-stone-600">{period?.label}</span>

                  </div>

            <div className="space-y-4">

    function HistoryViewer({ tasks }) {
      const [selectedDate, setSelectedDate] = useState(todayKey());
      const [history, setHistory] = useState({});
      const [availableDates, setAvailableDates] = useState([todayKey()]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        (async () => {
          try {
            const snap = await window.fb.getCollection('days');
            const dates = snap.docs.map(d => d.id).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse();
            const all = dates.includes(todayKey()) ? dates : [todayKey(), ...dates];
            setAvailableDates(all);
          } catch (err) {
            console.error(err);
            setAvailableDates([todayKey()]);
          }
        })();
      }, []);

      useEffect(() => {
        (async () => {
          setLoading(true);
          try {
            const snap = await window.fb.getDoc(`days/${selectedDate}`);
            setHistory(snap.exists() ? snap.data() : {});
          } catch { setHistory({}); }
          setLoading(false);
        })();
      }, [selectedDate]);

      const stats = { total: tasks.length, done: Object.keys(history).length, byEmployee: {} };
      Object.values(history).forEach(s => { if (s?.doneBy) stats.byEmployee[s.doneBy] = (stats.byEmployee[s.doneBy] || 0) + 1; });

      return (
        <div>
          <div className="mb-4 overflow-x-auto pb-1 no-scrollbar">
            <div className="flex gap-2">
              {availableDates.map(d => (
                <button key={d} onClick={() => setSelectedDate(d)}
                        className={`px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-colors ${selectedDate === d ? 'bg-stone-900 text-white' : 'bg-white border border-stone-200/60 text-stone-700'}`}>
                  {d === todayKey() ? 'Oggi' : formatDateLong(d)}
                </button>
              ))}
            </div>
          </div>
          {loading ? <div className="text-center text-stone-400 py-10 text-sm">Caricamento…</div> : (
            <>
              <div className="grid grid-cols-2 gap-3 mb-5">
                <div className="bg-white rounded-2xl p-4 border border-stone-200/60 shadow-sm">
                  <div className="t-11 uppercase tracking-wider text-stone-500 font-medium">Completate</div>
                  <div className="text-3xl font-semibold tracking-tight mt-1">{stats.done}<span className="text-base text-stone-400 font-normal">/{stats.total}</span></div>
                </div>
                <div className="bg-white rounded-2xl p-4 border border-stone-200/60 shadow-sm">
                  <div className="t-11 uppercase tracking-wider text-stone-500 font-medium">Operatori attivi</div>
                  <div className="text-3xl font-semibold tracking-tight mt-1">{Object.keys(stats.byEmployee).length}</div>
                </div>
              </div>
              {Object.keys(stats.byEmployee).length > 0 && (
                <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden mb-5">
                  <div className="px-4 py-2.5 t-11 uppercase tracking-wider text-stone-500 font-medium border-b border-stone-100">Per operatore</div>
                  {Object.entries(stats.byEmployee).sort((a, b) => b[1] - a[1]).map(([name, count], i) => (
                    <div key={name} className="px-4 py-3 flex items-center justify-between" style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                      <div className="font-medium t-15">{name}</div>
                      <div className="text-sm text-stone-500"><span className="font-semibold text-stone-900">{count}</span> mansioni</div>
                    </div>
                  ))}
                </div>
              )}
              <div className="space-y-4">
                {AREAS.map(area => {
                  const areaTasks = tasks.filter(t => t.area === area.id);
                  if (areaTasks.length === 0) return null;
                  return (
                    <div key={area.id}>
                      <div className="flex items-center gap-2 px-1 mb-2">
                        <Icon name={area.id === 'sala' ? 'utensils' : area.id === 'bar' ? 'coffee' : 'clipboard'} className="w-4 h-4" strokeWidth={2.5} />
                        <h3 className="font-semibold text-stone-900 text-sm" style={{ color: area.color }}>{area.label}</h3>
                      </div>
                      <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm overflow-hidden">
                        {areaTasks.map((t, i) => {
                          const s = history[t.id];
                          return (
                            <div key={t.id} className="px-4 py-3" style={{ borderTop: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.05)' }}>
                              <div className="flex items-start gap-3">
                                <div className="w-5 h-5 mt-0.5 rounded-full flex items-center justify-center flex-shrink-0" style={{ backgroundColor: s?.done ? '#34C759' : '#e7e5e4' }}>
                                  {s?.done && <Icon name="check" className="w-3 h-3 text-white" strokeWidth={3} />}
                                </div>
                                <div className="flex-1 min-w-0">
                                  <div className={`text-sm font-medium ${s?.done ? 'text-stone-900' : 'text-stone-400'}`}>{t.title}</div>
                                  {s?.done ? (
                                    <div className="t-11 text-stone-500 mt-0.5">{s.doneBy} · {formatTime(s.doneAt)}</div>
                                  ) : (
                                    <div className="t-11 text-stone-400 mt-0.5">Non eseguita</div>
                                  )}
                                </div>
                                <span className="t-10 uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-stone-100 text-stone-600">
                                  {PERIODS.find(p => p.id === t.period)?.label}
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      );
    }

    function SettingsPanel({ adminPin, onChangePin, onResetDay }) {
      const [oldPin, setOldPin] = useState('');
      const [newPin, setNewPin] = useState('');
      const [confirmPin, setConfirmPin] = useState('');
      const [msg, setMsg] = useState(null);

      const handleChangePin = async () => {
        if (oldPin !== adminPin) { setMsg({ type: 'err', text: 'PIN attuale errato' }); return; }
        if (!/^\d{4}$/.test(newPin)) { setMsg({ type: 'err', text: 'Il nuovo PIN deve essere 4 cifre' }); return; }
        if (newPin !== confirmPin) { setMsg({ type: 'err', text: 'I PIN non coincidono' }); return; }
        const ok = await onChangePin(newPin);
        if (ok) { setMsg({ type: 'ok', text: 'PIN aggiornato' }); setOldPin(''); setNewPin(''); setConfirmPin(''); }
        setTimeout(() => setMsg(null), 3000);
      };

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm p-5">
            <div className="flex items-center gap-2 mb-4">
              <Icon name="key" className="w-4 h-4 text-stone-700" />
              <h3 className="font-semibold tracking-tight">Cambio PIN amministratore</h3>
            </div>
            <div className="space-y-3">
              <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={4} value={oldPin}
                     onChange={e => setOldPin(e.target.value.replace(/\D/g, ''))} placeholder="PIN attuale"
                     className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900" />
              <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={4} value={newPin}
                     onChange={e => setNewPin(e.target.value.replace(/\D/g, ''))} placeholder="Nuovo PIN (4 cifre)"
                     className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900" />
              <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={4} value={confirmPin}
                     onChange={e => setConfirmPin(e.target.value.replace(/\D/g, ''))} placeholder="Conferma nuovo PIN"
                     className="w-full px-4 py-3 bg-stone-100 rounded-xl t-15 outline-none focus:ring-2 focus:ring-stone-900" />
              {msg && (
                <div className={`text-sm px-3 py-2 rounded-lg flex items-center gap-2 ${msg.type === 'err' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`}>
                  <Icon name="alert" className="w-4 h-4" /> {msg.text}
                </div>
              )}
              <button onClick={handleChangePin} className="w-full py-3 bg-stone-900 text-white rounded-xl font-medium hover:bg-stone-800">Aggiorna PIN</button>
            </div>
          </div>
          <div className="bg-white rounded-2xl border border-stone-200/60 shadow-sm p-5">
            <div className="flex items-center gap-2 mb-2">
              <Icon name="clock" className="w-4 h-4 text-stone-700" />
              <h3 className="font-semibold tracking-tight">Reset giornata corrente</h3>
            </div>
            <p className="text-sm text-stone-500 mb-4">Cancella tutte le mansioni completate di oggi. Lo storico dei giorni precedenti resta intatto.</p>
            <button onClick={() => { if (confirm('Resettare tutte le mansioni di oggi?')) onResetDay(); }}
                    className="w-full py-3 bg-red-50 text-red-600 rounded-xl font-medium hover:bg-red-100">Reset giornata</button>
          </div>
          <div className="bg-stone-100/60 rounded-2xl p-4 text-xs text-stone-500 leading-relaxed">
            <strong className="text-stone-700">Sincronizzazione:</strong> i dati sono condivisi via Firebase in tempo reale. Le modifiche di un dipendente sono visibili a tutti entro 1-2 secondi.
          </div>
        </div>
      );
    }

    function FilterChip({ label, active, onClick }) {
      return <button onClick={onClick} className={`px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${active ? 'bg-stone-900 text-white' : 'bg-white border border-stone-200/60 text-stone-700'}`}>{label}</button>;
    }

    function Field({ label, children }) {
      return (
        <div>
          <div className="t-11 uppercase tracking-widest text-stone-500 font-medium mb-1.5">{label}</div>
          {children}
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
